<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RISK NETWORK GROUP | Terminal Bourse [LIVE]</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'JetBrains Mono', monospace;
            background: #000;
            color: #e0e0e0;
            font-size: 11px;
            line-height: 1.3;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            background: #000;
            border-bottom: 2px solid #ff6600;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 42px;
        }
        .logo { color: #ff6600; font-weight: 800; font-size: 15px; letter-spacing: 1px; }
        
        .status { display: flex; gap: 15px; font-size: 10px; align-items: center; }
        .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .dot.live { background: #00ff41; box-shadow: 0 0 6px #00ff41; }
        .dot.sync { background: #ffaa00; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }

        .container { display: grid; grid-template-columns: 1fr 320px; height: calc(100vh - 42px); }
        
        /* THE ALIGNMENT FIX: Strict Table Layout */
        .stocks-panel { border-right: 1px solid #222; overflow: hidden; display: flex; flex-direction: column; }
        .panel-header {
            background: #0a0a0a;
            border-bottom: 1px solid #333;
            padding: 6px 10px;
            font-size: 10px;
            color: #ff6600;
            text-transform: uppercase;
        }

        .stock-table { 
            width: 100%; 
            border-collapse: collapse; 
            table-layout: fixed; /* Ensures columns never shift */
        }
        .stock-table th {
            background: #111;
            color: #888;
            padding: 10px 6px;
            text-align: left;
            border-bottom: 1px solid #333;
            font-size: 9px;
        }
        .stock-table td {
            padding: 8px 6px;
            border-bottom: 1px solid #111;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* PRECISE COLUMN WIDTHS (Matching the Design) */
        .col-ticker { width: 80px; color: #fff; font-weight: 700; }
        .col-sector { width: 160px; color: #aaa; }
        .col-cap    { width: 110px; text-align: right; color: #888; }
        .col-price  { width: 90px; text-align: right; color: #fff; font-weight: 700; }
        .col-var    { width: 80px; text-align: right; font-weight: 700; }
        .col-pe     { width: 60px; text-align: right; color: #888; }
        .col-sent   { width: 120px; text-align: center; }

        .up { color: #00ff41; }
        .down { color: #ff4444; }

        /* Sentiment Badges */
        .rating {
            padding: 2px 6px;
            font-size: 8px;
            font-weight: 700;
            border-radius: 2px;
            text-transform: uppercase;
        }
        .rating-buy { background: #00ff41; color: #000; }
        .rating-sell { background: #ff6600; color: #000; }
        .rating-neutral { background: #333; color: #eee; }

        .news-panel { background: #050505; display: flex; flex-direction: column; }
        .news-item { padding: 12px; border-bottom: 1px solid #1a1a1a; }
        .news-title { color: #ccc; text-decoration: none; font-size: 11px; transition: 0.2s; }
        .news-title:hover { color: #ff6600; }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #333; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">▶ RISK NETWORK GROUP TERMINAL</div>
        <div class="status">
            <div><span class="dot live" id="statusDot"></span><span id="statusTxt">LIVE</span></div>
            <div id="clock">00:00:00</div>
        </div>
    </div>

    <div class="container">
        <div class="stocks-panel">
            <div class="panel-header" id="stockHeader">◈ MASI ALL SHARES • INITIALIZING...</div>
            <div style="overflow-y: auto; flex: 1;">
                <table class="stock-table">
                    <thead>
                        <tr>
                            <th class="col-ticker">TICKER</th>
                            <th class="col-sector">SECTEUR</th>
                            <th class="col-cap">CAPITAL</th>
                            <th class="col-price">COURS</th>
                            <th class="col-var">VAR%</th>
                            <th class="col-pe">P/E</th>
                            <th class="col-sent">SENTIMENT</th>
                        </tr>
                    </thead>
                    <tbody id="stockBody"></tbody>
                </table>
            </div>
        </div>

        <div class="news-panel">
            <div class="panel-header">◢ MEDIAS24 FLUX</div>
            <div id="newsBody" style="overflow-y: auto;"></div>
        </div>
    </div>

    <script>
        const API_URL = 'https://risk-network-terminal.onrender.com/api';

        async function refreshDashboard() {
            const dot = document.getElementById('statusDot');
            dot.className = 'dot sync';

            try {
                // Fetch Stocks
                const sResp = await fetch(`${API_URL}/stocks`);
                const stocks = await sResp.json();
                renderStocks(stocks);

                // Fetch News
                const nResp = await fetch(`${API_URL}/news`);
                const news = await nResp.json();
                renderNews(news);

                dot.className = 'dot live';
                document.getElementById('stockHeader').innerText = `◈ MASI ALL SHARES • ${stocks.filter(s => s.has_live_data).length}/${stocks.length} ACTIFS`;
            } catch (err) {
                console.error("Fetch Error:", err);
                document.getElementById('statusTxt').innerText = "OFFLINE";
                dot.className = 'dot';
            }
        }

        function renderStocks(stocks) {
            const tbody = document.getElementById('stockBody');
            tbody.innerHTML = stocks.map(s => {
                const varClass = s.change > 0 ? 'up' : s.change < 0 ? 'down' : '';
                const ratingClass = s.rating.toLowerCase().includes('buy') ? 'rating-buy' : 
                                   s.rating.toLowerCase().includes('sell') ? 'rating-sell' : 'rating-neutral';
                
                return `
                <tr style="${s.has_live_data ? '' : 'opacity: 0.35'}">
                    <td class="col-ticker">${s.symbol}</td>
                    <td class="col-sector">${s.sector}</td>
                    <td class="col-cap">${s.capital}</td>
                    <td class="col-price">${s.price > 0 ? s.price.toFixed(2) : '—'}</td>
                    <td class="col-var ${varClass}">${s.change > 0 ? '+' : ''}${s.change.toFixed(2)}%</td>
                    <td class="col-pe">${s.pe ? s.pe.toFixed(1) : '—'}</td>
                    <td class="col-sent"><span class="rating ${ratingClass}">${s.rating}</span></td>
                </tr>`;
            }).join('');
        }

        function renderNews(news) {
            document.getElementById('newsBody').innerHTML = news.map(n => `
                <div class="news-item">
                    <a href="${n.link}" target="_blank" class="news-title">${n.title}</a>
                </div>
            `).join('');
        }

        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('fr-FR', {hour12: false});
        }, 1000);

        refreshDashboard();
        setInterval(refreshDashboard, 60000); // Auto-refresh every minute
    </script>
</body>
</html>
