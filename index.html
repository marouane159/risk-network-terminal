<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RISK NETWORK | Terminal Bourse Casablanca [LIVE]</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #121212;
            --bg-tertiary: #1a1a1a;
            --text-primary: #e0e0e0;
            --text-secondary: #999999;
            --text-muted: #666666;
            --accent: #ff6600;
            --accent-hover: #ff7722;
            --up: #00ff88;
            --down: #ff4466;
            --border: #2a2a2a;
        }
        
        [data-theme="light"] {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f8f8;
            --bg-tertiary: #f0f0f0;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --text-muted: #999999;
            --accent: #ff6600;
            --accent-hover: #ff7722;
            --up: #00cc66;
            --down: #ff3344;
            --border: #e0e0e0;
        }
        
        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 13px;
            line-height: 1.5;
            height: 100vh;
            overflow: hidden;
            transition: all 0.3s;
        }
        
        /* Header */
        .header {
            background: var(--bg-secondary);
            border-bottom: 2px solid var(--accent);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
        }
        
        .logo {
            color: var(--accent);
            font-weight: 800;
            font-size: 16px;
            letter-spacing: 2px;
        }
        
        .header-center {
            display: flex;
            align-items: center;
            gap: 24px;
        }
        
        .masi-box {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            background: var(--bg-tertiary);
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        
        .masi-label {
            color: var(--text-muted);
            font-size: 11px;
            text-transform: uppercase;
        }
        
        .masi-price {
            font-weight: 700;
            font-size: 16px;
        }
        
        .masi-change {
            font-size: 13px;
            font-weight: 600;
        }
        
        .market-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .market-open {
            background: rgba(0, 255, 136, 0.1);
            color: var(--up);
            border: 1px solid rgba(0, 255, 136, 0.3);
        }
        
        .market-closed {
            background: rgba(255, 68, 102, 0.1);
            color: var(--down);
            border: 1px solid rgba(255, 68, 102, 0.3);
        }
        
        .market-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        .market-open .market-dot {
            background: var(--up);
            box-shadow: 0 0 10px var(--up);
        }
        
        .market-closed .market-dot {
            background: var(--down);
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            padding: 6px 12px;
            background: var(--bg-tertiary);
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        
        .status-live { background: var(--up); box-shadow: 0 0 8px var(--up); }
        .status-loading { background: #ffaa00; animation: pulse 1s infinite; }
        .status-error { background: var(--down); }
        
        .btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-1px);
        }
        
        .btn-primary {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }
        
        .btn-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
            color: #000;
        }
        
        .clock {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 600;
        }
        
        /* Main Layout */
        .container {
            display: grid;
            grid-template-columns: 1fr 360px;
            height: calc(100vh - 60px);
            gap: 0;
        }
        
        /* Stocks Panel */
        .stocks-panel {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-right: 1px solid var(--border);
        }
        
        .panel-header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .panel-title {
            color: var(--accent);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }
        
        .panel-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .last-update {
            color: var(--text-muted);
            font-size: 11px;
        }
        
        /* Table */
        .table-wrapper {
            flex: 1;
            overflow-y: auto;
        }
        
        .stocks-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .stocks-table thead {
            position: sticky;
            top: 0;
            background: var(--bg-secondary);
            z-index: 10;
        }
        
        .stocks-table th {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 2px solid var(--border);
            color: var(--text-muted);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }
        
        .stocks-table td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }
        
        .stock-row {
            transition: all 0.2s;
            cursor: pointer;
        }
        
        .stock-row:hover {
            background: var(--bg-tertiary);
        }
        
        .symbol {
            color: var(--accent);
            font-weight: 700;
            font-size: 14px;
        }
        
        .sector {
            color: var(--text-secondary);
            font-size: 11px;
        }
        
        .price {
            font-weight: 700;
            font-size: 14px;
        }
        
        .change {
            font-weight: 700;
            font-size: 13px;
        }
        
        .change.up { color: var(--up); }
        .change.down { color: var(--down); }
        .change.neutral { color: var(--text-muted); }
        
        .rating {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }
        
        .rating-strong-buy { background: rgba(0, 255, 136, 0.15); color: var(--up); }
        .rating-buy { background: rgba(0, 200, 100, 0.15); color: #00cc66; }
        .rating-hold { background: rgba(255, 170, 0, 0.15); color: #ffaa00; }
        .rating-sell { background: rgba(255, 68, 102, 0.15); color: #ff6688; }
        .rating-none { color: var(--text-muted); background: transparent; }
        
        /* News Panel */
        .news-panel {
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            overflow: hidden;
        }
        
        .news-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        
        .news-item {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .news-item:last-child {
            border-bottom: none;
        }
        
        .news-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .news-time {
            color: var(--text-muted);
            font-size: 10px;
        }
        
        .news-category {
            background: var(--accent);
            color: #000;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: 700;
        }
        
        .news-title {
            display: block;
            color: var(--text-primary);
            text-decoration: none;
            line-height: 1.6;
            font-size: 12px;
            transition: color 0.2s;
        }
        
        .news-title:hover {
            color: var(--accent);
        }
        
        .loading, .error {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        
        .error {
            color: var(--down);
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 5px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }
        
        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .stock-row {
            animation: fadeIn 0.3s ease;
        }
    </style>
</head>
<body data-theme="dark">
    <!-- Header -->
    <div class="header">
        <div class="logo">⚡ RISK NETWORK</div>
        
        <div class="header-center">
            <div class="masi-box">
                <span class="masi-label">MASI</span>
                <span id="masiPrice" class="masi-price">13,500.00</span>
                <span id="masiChange" class="masi-change">+0.00%</span>
            </div>
            
            <div id="marketStatus" class="market-status market-closed">
                <span class="market-dot"></span>
                <span id="marketText">FERMÉ</span>
            </div>
        </div>
        
        <div class="header-right">
            <div class="status-badge">
                <span id="statusDot" class="status-dot status-loading"></span>
                <span id="statusText">CONNECTING...</span>
            </div>
            
            <select id="langSelect" class="btn">
                <option value="fr">🇫🇷 FR</option>
                <option value="en">🇬🇧 EN</option>
                <option value="ar">🇲🇦 AR</option>
            </select>
            
            <button id="themeBtn" class="btn">☀️</button>
            
            <span id="clock" class="clock">--:--:--</span>
        </div>
    </div>
    
    <!-- Main Container -->
    <div class="container">
        <!-- Stocks Panel -->
        <div class="stocks-panel">
            <div class="panel-header">
                <span id="panelTitle" class="panel-title">📈 BOURSE DE CASABLANCA</span>
                <div class="panel-actions">
                    <span id="lastUpdate" class="last-update">Mise à jour...</span>
                    <button id="refreshBtn" class="btn btn-primary">↻ ACTUALISER</button>
                </div>
            </div>
            
            <div class="table-wrapper">
                <table class="stocks-table">
                    <thead>
                        <tr>
                            <th id="thSymbol">SYMBOLE</th>
                            <th id="thSector">SECTEUR</th>
                            <th id="thCap">CAP.</th>
                            <th id="thPrice">PRIX</th>
                            <th id="thChange">VAR %</th>
                            <th id="thPE">P/E</th>
                            <th id="thRating">RATING</th>
                        </tr>
                    </thead>
                    <tbody id="stocksBody">
                        <tr><td colspan="7" class="loading">🔄 Chargement des données...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <!-- News Panel -->
        <div class="news-panel">
            <div class="panel-header">
                <span class="panel-title">📰 ACTUALITÉS BOURSE</span>
            </div>
            <div class="news-list" id="newsList">
                <div class="loading">🔄 Chargement des actualités...</div>
            </div>
        </div>
    </div>
    
    <script>
        // Configuration
        const API_URL = window.location.origin;
        
        // State
        let currentLang = 'fr';
        let currentTheme = 'dark';
        let stocksData = [];
        let newsData = [];
        
        // Translations
        const translations = {
            fr: {
                panelTitle: '📈 BOURSE DE CASABLANCA',
                symbol: 'SYMBOLE', sector: 'SECTEUR', cap: 'CAP.', price: 'PRIX',
                change: 'VAR %', pe: 'P/E', rating: 'RATING',
                marketOpen: 'OUVERT', marketClosed: 'FERMÉ',
                live: 'LIVE', connecting: 'CONNEXION...', error: 'ERREUR',
                loading: 'Chargement...', updated: 'Mis à jour',
                minutes: 'min', hours: 'h', days: 'j',
                strongBuy: 'ACHAT+', buy: 'ACHAT', hold: 'NEUTRE', sell: 'VENTE'
            },
            en: {
                panelTitle: '📈 CASABLANCA STOCK EXCHANGE',
                symbol: 'SYMBOL', sector: 'SECTOR', cap: 'CAP.', price: 'PRICE',
                change: 'CHG %', pe: 'P/E', rating: 'RATING',
                marketOpen: 'OPEN', marketClosed: 'CLOSED',
                live: 'LIVE', connecting: 'CONNECTING...', error: 'ERROR',
                loading: 'Loading...', updated: 'Updated',
                minutes: 'm', hours: 'h', days: 'd',
                strongBuy: 'STRONG BUY', buy: 'BUY', hold: 'HOLD', sell: 'SELL'
            },
            ar: {
                panelTitle: '📈 بورصة الدار البيضاء',
                symbol: 'الرمز', sector: 'القطاع', cap: 'القيمة', price: 'السعر',
                change: 'التغير %', pe: 'P/E', rating: 'التقييم',
                marketOpen: 'مفتوح', marketClosed: 'مغلق',
                live: 'مباشر', connecting: 'اتصال...', error: 'خطأ',
                loading: 'جار التحميل...', updated: 'محدث',
                minutes: 'د', hours: 'س', days: 'ي',
                strongBuy: 'شراء+', buy: 'شراء', hold: 'محايد', sell: 'بيع'
            }
        };
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 RISK Network Terminal initializing...');
            
            // Event listeners
            document.getElementById('langSelect').addEventListener('change', (e) => {
                currentLang = e.target.value;
                updateTranslations();
                renderStocks();
                renderNews();
            });
            
            document.getElementById('themeBtn').addEventListener('click', () => {
                currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
                document.body.setAttribute('data-theme', currentTheme);
                document.getElementById('themeBtn').textContent = currentTheme === 'dark' ? '☀️' : '🌙';
            });
            
            document.getElementById('refreshBtn').addEventListener('click', fetchData);
            
            // Initial fetch
            fetchData();
            
            // Auto-refresh every 10 minutes
            setInterval(fetchData, 600000);
            
            // Update clock
            setInterval(updateClock, 1000);
            updateClock();
        });
        
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('fr-FR', { hour12: false });
        }
        
        function updateTranslations() {
            const t = translations[currentLang];
            document.getElementById('panelTitle').textContent = t.panelTitle;
            document.getElementById('thSymbol').textContent = t.symbol;
            document.getElementById('thSector').textContent = t.sector;
            document.getElementById('thCap').textContent = t.cap;
            document.getElementById('thPrice').textContent = t.price;
            document.getElementById('thChange').textContent = t.change;
            document.getElementById('thPE').textContent = t.pe;
            document.getElementById('thRating').textContent = t.rating;
        }
        
        async function fetchData() {
            setStatus('loading');
            
            try {
                const response = await fetch(`${API_URL}/api/all`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                console.log('✓ Data received:', data);
                
                stocksData = data.stocks || [];
                newsData = data.news || [];
                
                renderStocks();
                renderNews();
                renderMasi(data.masi);
                renderMarketStatus(data.market_status);
                
                if (data.last_update) {
                    const time = new Date(data.last_update).toLocaleTimeString('fr-FR');
                    document.getElementById('lastUpdate').textContent = `${translations[currentLang].updated}: ${time}`;
                }
                
                setStatus('live');
                
            } catch (error) {
                console.error('✗ Fetch error:', error);
                setStatus('error');
                document.getElementById('stocksBody').innerHTML = 
                    `<tr><td colspan="7" class="error">❌ Erreur de connexion: ${error.message}</td></tr>`;
            }
        }
        
        function setStatus(status) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            const t = translations[currentLang];
            
            dot.className = 'status-dot';
            
            if (status === 'live') {
                dot.classList.add('status-live');
                text.textContent = t.live;
            } else if (status === 'loading') {
                dot.classList.add('status-loading');
                text.textContent = t.connecting;
            } else {
                dot.classList.add('status-error');
                text.textContent = t.error;
            }
        }
        
        function renderMasi(masi) {
            if (!masi) return;
            
            document.getElementById('masiPrice').textContent = masi.price.toLocaleString('fr-FR', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
            
            const changeEl = document.getElementById('masiChange');
            const sign = masi.change_percent >= 0 ? '+' : '';
            changeEl.textContent = `${sign}${masi.change_percent.toFixed(2)}%`;
            changeEl.style.color = masi.change_percent >= 0 ? 'var(--up)' : 'var(--down)';
        }
        
        function renderMarketStatus(status) {
            if (!status) return;
            
            const container = document.getElementById('marketStatus');
            const text = document.getElementById('marketText');
            const t = translations[currentLang];
            
            if (status.is_open) {
                container.className = 'market-status market-open';
                text.textContent = t.marketOpen;
            } else {
                container.className = 'market-status market-closed';
                text.textContent = t.marketClosed;
            }
        }
        
        function renderStocks() {
            const tbody = document.getElementById('stocksBody');
            const t = translations[currentLang];
            
            if (stocksData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="loading">🔄 ${t.loading}</td></tr>`;
                return;
            }
            
            let html = '';
            
            stocksData.forEach(stock => {
                const changeClass = stock.change > 0 ? 'up' : stock.change < 0 ? 'down' : 'neutral';
                const sign = stock.change > 0 ? '+' : '';
                const peText = stock.pe ? stock.pe.toFixed(1) : '—';
                const ratingClass = getRatingClass(stock.rating);
                const ratingText = getRatingText(stock.rating, t);
                
                html += `
                    <tr class="stock-row">
                        <td class="symbol">${stock.symbol}</td>
                        <td class="sector">${stock.sector}</td>
                        <td>${stock.capital}</td>
                        <td class="price">${stock.price.toFixed(2)}</td>
                        <td class="change ${changeClass}">${sign}${stock.change.toFixed(2)}%</td>
                        <td>${peText}</td>
                        <td><span class="rating ${ratingClass}">${ratingText}</span></td>
                    </tr>
                `;
            });
            
            tbody.innerHTML = html;
        }
        
        function getRatingClass(rating) {
            if (!rating || rating === '—') return 'rating-none';
            const r = rating.toLowerCase();
            if (r.includes('strong buy')) return 'rating-strong-buy';
            if (r.includes('buy')) return 'rating-buy';
            if (r.includes('hold')) return 'rating-hold';
            if (r.includes('sell')) return 'rating-sell';
            return 'rating-none';
        }
        
        function getRatingText(rating, t) {
            if (!rating || rating === '—') return '—';
            const r = rating.toLowerCase();
            if (r.includes('strong buy')) return t.strongBuy;
            if (r.includes('buy')) return t.buy;
            if (r.includes('hold')) return t.hold;
            if (r.includes('sell')) return t.sell;
            return '—';
        }
        
        function renderNews() {
            const container = document.getElementById('newsList');
            const t = translations[currentLang];
            
            if (newsData.length === 0) {
                container.innerHTML = `<div class="loading">🔄 ${t.loading}</div>`;
                return;
            }
            
            let html = '';
            
            newsData.slice(0, 8).forEach(item => {
                const timeText = formatTime(item.time, t);
                
                html += `
                    <div class="news-item">
                        <div class="news-meta">
                            <span class="news-time">${timeText}</span>
                            <span class="news-category">${item.category}</span>
                        </div>
                        <a href="${item.link}" target="_blank" class="news-title">${item.title}</a>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        function formatTime(minutes, t) {
            if (minutes < 60) return `${minutes}${t.minutes}`;
            if (minutes < 1440) return `${Math.floor(minutes / 60)}${t.hours}`;
            return `${Math.floor(minutes / 1440)}${t.days}`;
        }
    </script>
</body>
</html>
