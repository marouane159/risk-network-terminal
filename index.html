<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RISK NETWORK GROUP | Terminal Bourse [LIVE]</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'JetBrains Mono', monospace;
            background: #000;
            color: #e0e0e0;
            font-size: 14px;
            line-height: 1.4;
        }
        .header {
            background: linear-gradient(90deg, #000 0%, #1a0f00 100%);
            border-bottom: 2px solid #ff6600;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { color: #ff6600; font-weight: 800; font-size: 18px; letter-spacing: 2px; }
        
        /* Social Media Links - Terminal Style */
        .social-bar {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .social-link {
            color: #666;
            text-decoration: none;
            font-size: 11px;
            border: 1px solid #333;
            padding: 4px 8px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .social-link:hover {
            color: #ff6600;
            border-color: #ff6600;
            background: rgba(255, 102, 0, 0.1);
        }
        .social-icon {
            font-size: 12px;
        }
        .website-link {
            color: #000;
            background: #ff6600;
            border-color: #ff6600;
            font-weight: 700;
        }
        .website-link:hover {
            background: #ff8833;
            color: #000;
        }
        
        .status { display: flex; gap: 20px; font-size: 12px; }
        .status-item { display: flex; align-items: center; gap: 5px; }
        .dot { width: 8px; height: 8px; background: #333; display: inline-block; }
        .dot.live { background: #00ff41; box-shadow: 0 0 8px #00ff41; }
        .dot.offline { background: #ff0000; }
        
        .container { display: grid; grid-template-columns: 1fr 350px; height: calc(100vh - 50px); }
        
        /* Mobile responsive for social bar */
        @media (max-width: 900px) {
            .header {
                flex-direction: column;
                gap: 10px;
                padding: 10px;
            }
            .social-bar {
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
            }
            .social-link {
                font-size: 10px;
                padding: 3px 6px;
            }
        }
        
        /* Stocks Panel */
        .stocks-panel { border-right: 1px solid #222; overflow: hidden; display: flex; flex-direction: column; }
        .panel-header {
            background: #0a0a0a;
            border-bottom: 1px solid #333;
            padding: 8px 15px;
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .stock-table { width: 100%; border-collapse: collapse; }
        .stock-table th {
            background: #111;
            color: #666;
            font-weight: 400;
            text-align: left;
            padding: 10px 15px;
            border-bottom: 1px solid #333;
            font-size: 12px;
            position: sticky;
            top: 0;
        }
        .stock-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #1a1a1a;
            font-size: 14px;
        }
        .stock-row:hover { background: #1a0f00; cursor: pointer; }
        .symbol { color: #fff; font-weight: 700; }
        .price { text-align: right; color: #fff; font-weight: 700; }
        .change { text-align: right; font-weight: 700; }
        .change.up { color: #00ff41; }
        .change.down { color: #ff6600; }
        .change.neutral { color: #888; }
        
        /* News Panel */
        .news-panel { background: #050505; overflow: hidden; display: flex; flex-direction: column; }
        .news-item {
            padding: 12px 15px;
            border-bottom: 1px solid #1a1a1a;
            font-size: 12px;
            line-height: 1.5;
        }
        .news-item:hover { background: #1a0f00; }
        .news-time { color: #ff6600; font-size: 11px; margin-bottom: 4px; }
        .news-title { color: #ccc; text-decoration: none; display: block; }
        .news-title:hover { color: #fff; }
        .news-source { color: #666; font-size: 10px; margin-top: 4px; }
        
        .loading { color: #ff6600; padding: 20px; text-align: center; font-size: 12px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        .error { color: #ff0000; padding: 10px; font-size: 11px; border-left: 3px solid #ff0000; margin: 10px; background: #1a0000; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #ff6600; }
        
        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
            .news-panel { border-top: 2px solid #333; height: 300px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">▶ RISK NETWORK GROUP</div>
        
        <!-- Social Media Bar -->
        <div class="social-bar">
            <a href="https://risk.ma" target="_blank" class="social-link website-link">
                <span class="social-icon">🌐</span> RISK.MA
            </a>
            <a href="https://x.com/dogofallstreets" target="_blank" class="social-link">
                <span class="social-icon">𝕏</span> X
            </a>
            <a href="https://tiktok.com/u/@dogofallstreets" target="_blank" class="social-link">
                <span class="social-icon">🎵</span> TIKTOK
            </a>
            <a href="https://instagram.com/risk.maroc" target="_blank" class="social-link">
                <span class="social-icon">📷</span> IG
            </a>
            <a href="https://t.me/boursedecasa" target="_blank" class="social-link">
                <span class="social-icon">✈️</span> TG
            </a>
        </div>

        <div class="status">
            <div class="status-item">
                <span class="dot" id="apiDot"></span>
                <span id="apiStatus">CONNECTING...</span>
            </div>
            <div class="status-item">
                <span id="clock">00:00:00</span>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- Stocks Panel -->
        <div class="stocks-panel">
            <div class="panel-header">COURS EN TEMPS RÉEL • MASI ALL SHARES</div>
            <div style="overflow-y: auto; flex: 1;">
                <table class="stock-table">
                    <thead>
                        <tr>
                            <th style="width: 25%">TICKER</th>
                            <th style="width: 35%; text-align: right">DERNIER (MAD)</th>
                            <th style="width: 40%; text-align: right">VARIATION %</th>
                        </tr>
                    </thead>
                    <tbody id="stockTableBody">
                        <tr><td colspan="3" class="loading">RÉCUPÉRATION DES DONNÉES...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- News Panel -->
        <div class="news-panel">
            <div class="panel-header">◢ MEDIAS24 • LE BOURSIER</div>
            <div style="overflow-y: auto; flex: 1;" id="newsContainer">
                <div class="loading">CHARGEMENT DU FLUX RSS...</div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const API_URL = 'https://risk-network-terminal.onrender.com/api/stocks';
        const RSS_URL = 'https://medias24.com/categorie/leboursier/actus/feed/';
        const REFRESH_INTERVAL = 30000; // 30 seconds

        // Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('fr-FR', {hour12: false});
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Fetch Stocks from API
        async function fetchStocks() {
            const dot = document.getElementById('apiDot');
            const status = document.getElementById('apiStatus');
            
            dot.className = 'dot';
            status.textContent = 'SYNC...';
            
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('API Error');
                
                const stocks = await response.json();
                renderStocks(stocks);
                
                dot.className = 'dot live';
                status.textContent = 'LIVE';
            } catch (error) {
                console.error('Stock fetch error:', error);
                dot.className = 'dot offline';
                status.textContent = 'OFFLINE';
                showStockError();
            }
        }

        function renderStocks(stocks) {
            const tbody = document.getElementById('stockTableBody');
            if (!stocks || stocks.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="error">AUCUNE DONNÉE DISPONIBLE</td></tr>';
                return;
            }

            let html = '';
            stocks.forEach(stock => {
                const changeClass = stock.change > 0 ? 'up' : stock.change < 0 ? 'down' : 'neutral';
                const sign = stock.change > 0 ? '+' : '';
                
                html += `
                    <tr class="stock-row">
                        <td class="symbol">${stock.symbol}</td>
                        <td class="price">${stock.price.toFixed(2)}</td>
                        <td class="change ${changeClass}">${sign}${stock.change.toFixed(2)}%</td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        function showStockError() {
            document.getElementById('stockTableBody').innerHTML = 
                '<tr><td colspan="3" class="error">ERREUR CONNEXION API<br>Vérifiez que le serveur est en ligne</td></tr>';
        }

        // Fetch News directly from RSS (Client-side)
        async function fetchNews() {
            const container = document.getElementById('newsContainer');
            
            try {
                // Using a CORS proxy since medias24 might block direct browser requests
                const proxyUrls = [
                    'https://api.allorigins.win/raw?url=' + encodeURIComponent(RSS_URL),
                    'https://api.codetabs.com/v1/proxy?quest=' + RSS_URL
                ];
                
                let response = null;
                
                for (let url of proxyUrls) {
                    try {
                        response = await fetch(url, { 
                            mode: 'cors',
                            headers: { 'Accept': 'application/rss+xml, application/xml' }
                        });
                        if (response.ok) break;
                    } catch (e) {
                        continue;
                    }
                }
                
                if (!response || !response.ok) throw new Error('RSS Fetch Failed');
                
                const text = await response.text();
                parseRSS(text);
                
            } catch (error) {
                console.error('News fetch error:', error);
                container.innerHTML = `
                    <div class="error">
                        ERREUR CHARGEMENT RSS<br>
                        <button onclick="fetchNews()" style="background:#ff6600;color:#000;border:none;padding:5px 10px;margin-top:10px;cursor:pointer;font-family:inherit;">RÉESSAYER</button>
                    </div>
                `;
            }
        }

        function parseRSS(xmlText) {
            const parser = new DOMParser();
            const xml = parser.parseFromString(xmlText, 'text/xml');
            const items = xml.querySelectorAll('item');
            
            let html = '';
            let count = 0;
            
            items.forEach(item => {
                if (count >= 15) return;
                
                const title = item.querySelector('title')?.textContent || 'Sans titre';
                const link = item.querySelector('link')?.textContent || '#';
                const pubDate = item.querySelector('pubDate')?.textContent || '';
                const category = item.querySelector('category')?.textContent || 'INFO';
                
                let timeStr = '';
                if (pubDate) {
                    const date = new Date(pubDate);
                    timeStr = date.toLocaleDateString('fr-FR') + ' ' + date.toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'});
                }
                
                html += `
                    <div class="news-item">
                        <div class="news-time">${timeStr} • ${category}</div>
                        <a href="${link}" target="_blank" class="news-title">${title}</a>
                        <div class="news-source">Medias24.com</div>
                    </div>
                `;
                count++;
            });
            
            document.getElementById('newsContainer').innerHTML = html;
        }

        // Initial load and refresh
        fetchStocks();
        fetchNews();
        
        setInterval(() => {
            fetchStocks();
            fetchNews();
        }, REFRESH_INTERVAL);
    </script>
</body>
</html>
