<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>RISK NETWORK | TERMINAL</title>
    <style>
        body { background: #000; color: #ff6600; font-family: 'JetBrains Mono', monospace; margin: 0; padding: 10px; }
        .terminal-grid { 
            display: grid; 
            grid-template-columns: 80px 180px 100px 100px 80px 60px 120px; 
            border-bottom: 2px solid #ff6600;
            padding: 10px 0;
            font-weight: bold;
            font-size: 12px;
        }
        .row { 
            display: grid; 
            grid-template-columns: 80px 180px 100px 100px 80px 60px 120px; 
            border-bottom: 1px solid #222;
            padding: 8px 0;
            color: #eee;
            font-size: 11px;
            align-items: center;
        }
        .ticker { color: #fff; font-weight: bold; }
        .up { color: #00ff41; }
        .down { color: #ff4444; }
        .rating { background: #333; padding: 2px 5px; border-radius: 3px; font-size: 10px; text-align: center; }
    </style>
</head>
<body>
    <div style="font-size: 18px; margin-bottom: 20px;">▶ RISK NETWORK GROUP TERMINAL - MOROCCO LIVE</div>
    
    <div class="terminal-grid">
        <div>TICKER</div>
        <div>SECTEUR</div>
        <div>CAPITAL</div>
        <div>COURS</div>
        <div>VAR%</div>
        <div>P/E</div>
        <div>SENTIMENT</div>
    </div>

    <div id="data-container"></div>

    <script>
        async function loadData() {
            try {
                const response = await fetch('https://risk-network-terminal.onrender.com/api/stocks');
                const data = await response.json();
                const container = document.getElementById('data-container');
                container.innerHTML = '';

                data.forEach(stock => {
                    const isUp = stock.change.includes('+');
                    const colorClass = isUp ? 'up' : stock.change.includes('-') ? 'down' : '';
                    
                    container.innerHTML += `
                        <div class="row">
                            <div class="ticker">${stock.ticker}</div>
                            <div style="color:#888">${stock.sector}</div>
                            <div style="text-align:right; padding-right:10px">${stock.cap}</div>
                            <div style="text-align:right; padding-right:10px">${stock.price}</div>
                            <div class="${colorClass}">${stock.change}</div>
                            <div style="text-align:right; padding-right:10px">${stock.pe}</div>
                            <div class="rating">${stock.rating}</div>
                        </div>
                    `;
                });
            } catch (e) { console.error(e); }
        }
        loadData();
        setInterval(loadData, 60000);
    </script>
</body>
</html>
