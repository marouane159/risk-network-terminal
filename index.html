<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RISK NETWORK GROUP | Terminal Bourse [LIVE]</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'JetBrains Mono', monospace;
            background: #000;
            color: #e0e0e0;
            font-size: 11px;
            line-height: 1.3;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(90deg, #000 0%, #1a0f00 100%);
            border-bottom: 2px solid #ff6600;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 42px;
        }
        .logo { color: #ff6600; font-weight: 800; font-size: 15px; letter-spacing: 1px; }
        
        .social-bar {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .social-link {
            color: #666;
            text-decoration: none;
            font-size: 9px;
            border: 1px solid #333;
            padding: 2px 5px;
            transition: all 0.3s;
        }
        .social-link:hover {
            color: #ff6600;
            border-color: #ff6600;
            background: rgba(255, 102, 0, 0.1);
        }
        .website-link {
            color: #000;
            background: #ff6600;
            border-color: #ff6600;
            font-weight: 700;
        }
        
        .status { display: flex; gap: 12px; font-size: 10px; align-items: center; }
        .dot { width: 6px; height: 6px; background: #333; display: inline-block; }
        .dot.live { background: #00ff41; box-shadow: 0 0 6px #00ff41; }
        .dot.offline { background: #ff0000; }
        .dot.sync { background: #ffaa00; animation: pulse 1s infinite; }
        
        .container { display: grid; grid-template-columns: 1fr 350px; height: calc(100vh - 42px); }
        
        .stocks-panel { border-right: 1px solid #222; overflow: hidden; display: flex; flex-direction: column; }
        .panel-header {
            background: #0a0a0a;
            border-bottom: 1px solid #333;
            padding: 5px 8px;
            font-size: 10px;
            color: #ff6600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* Table with exact column alignment per TradingView */
        .stock-table { 
            width: 100%; 
            border-collapse: collapse; 
            table-layout: fixed;
            font-size: 10px;
        }
        .stock-table th {
            background: #111;
            color: #888;
            font-weight: 400;
            text-align: left;
            padding: 6px 4px;
            border-bottom: 1px solid #333;
            font-size: 9px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .stock-table td {
            padding: 4px;
            border-bottom: 1px solid #1a1a1a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            vertical-align: middle;
        }
        .stock-row:hover { background: #1a0f00; }
        
        /* Column widths matching TradingView layout */
        .col-symbol { width: 8%; color: #fff; font-weight: 700; }
        .col-price { width: 10%; color: #fff; font-weight: 700; text-align: right; }
        .col-change-pct { width: 9%; text-align: right; font-weight: 700; }
        .col-change { width: 9%; text-align: right; }
        .col-rating { width: 10%; text-align: center; }
        .col-volume { width: 10%; text-align: right; color: #888; }
        .col-market-cap { width: 11%; text-align: right; color: #888; }
        .col-pe { width: 8%; text-align: right; color: #888; }
        .col-eps { width: 8%; text-align: right; color: #888; }
        .col-employees { width: 9%; text-align: right; color: #666; }
        .col-sector { width: 18%; color: #aaa; }
        
        .change.up { color: #00ff41; }
        .change.down { color: #ff6600; }
        .change.neutral { color: #888; }
        .no-data { color: #444; font-style: italic; }
        
        /* Rating badges matching TradingView colors */
        .rating {
            display: inline-block;
            padding: 1px 4px;
            font-size: 8px;
            border-radius: 2px;
            font-weight: 700;
            white-space: nowrap;
        }
        .rating-strong-buy { background: #00ff41; color: #000; }
        .rating-buy { background: #90ee90; color: #000; }
        .rating-neutral { background: #666; color: #fff; }
        .rating-hold { background: #888; color: #fff; }
        .rating-sell { background: #ff6600; color: #000; }
        .rating-strong-sell { background: #ff0000; color: #fff; }
        .rating-none { background: transparent; color: #444; border: 1px solid #333; }
        
        .news-panel { background: #050505; overflow: hidden; display: flex; flex-direction: column; }
        .news-list { overflow-y: auto; flex: 1; padding: 5px; }
        .news-item {
            padding: 8px;
            border-bottom: 1px solid #1a1a1a;
            margin-bottom: 5px;
            background: #0a0a0a;
        }
        .news-time { 
            color: #ff6600; 
            font-size: 9px; 
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }
        .news-title { 
            color: #ccc; 
            text-decoration: none; 
            font-size: 11px;
            line-height: 1.4;
            display: block;
        }
        .news-title:hover { color: #fff; text-decoration: underline; }
        .news-cat { 
            color: #666; 
            font-size: 8px; 
            background: #1a1a1a; 
            padding: 1px 4px;
            border-radius: 2px;
        }
        
        .loading { 
            color: #ff6600; 
            padding: 15px; 
            text-align: center; 
            font-size: 11px; 
            animation: pulse 1.5s infinite; 
        }
        .error { 
            color: #ff0000; 
            padding: 10px; 
            font-size: 10px; 
            border-left: 3px solid #ff0000; 
            margin: 8px; 
            background: #1a0000; 
        }
        .refresh-btn {
            background: #ff6600;
            color: #000;
            border: none;
            padding: 3px 8px;
            font-family: inherit;
            font-size: 10px;
            cursor: pointer;
            font-weight: 700;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; }
        
        @media (max-width: 1000px) {
            .container { grid-template-columns: 1fr; grid-template-rows: 1fr 200px; }
            body { font-size: 10px; }
            .col-employees, .col-eps { display: none; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">▶ RISK NETWORK GROUP</div>
        
        <div class="social-bar">
            <a href="https://risk.ma" target="_blank" class="social-link website-link">RISK.MA</a>
            <a href="https://x.com/dogofallstreets" target="_blank" class="social-link">X</a>
            <a href="https://tiktok.com/u/@dogofallstreets" target="_blank" class="social-link">TK</a>
            <a href="https://instagram.com/risk.maroc" target="_blank" class="social-link">IG</a>
            <a href="https://t.me/boursedecasa" target="_blank" class="social-link">TG</a>
        </div>

        <div class="status">
            <div class="status-item">
                <span class="dot" id="apiDot"></span>
                <span id="apiStatus">CONNECTING...</span>
            </div>
            <div class="status-item" id="clock">00:00:00</div>
        </div>
    </div>

    <div class="container">
        <!-- Stocks Panel -->
        <div class="stocks-panel">
            <div class="panel-header" id="stockHeader">◈ MASI ALL SHARES • CHARGEMENT...</div>
            <div style="overflow-y: auto; flex: 1;">
                <table class="stock-table">
                    <thead>
                        <tr>
                            <th class="col-symbol">SYMBOL</th>
                            <th class="col-price">PRICE</th>
                            <th class="col-change-pct">CHG %</th>
                            <th class="col-change">CHANGE</th>
                            <th class="col-rating">RATING</th>
                            <th class="col-volume">VOLUME</th>
                            <th class="col-market-cap">MKT CAP</th>
                            <th class="col-pe">P/E</th>
                            <th class="col-eps">EPS</th>
                            <th class="col-employees">EMPL</th>
                            <th class="col-sector">SECTOR</th>
                        </tr>
                    </thead>
                    <tbody id="stockTableBody">
                        <tr><td colspan="11" class="loading">CONNEXION À L'API...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- News Panel -->
        <div class="news-panel">
            <div class="panel-header" style="display: flex; justify-content: space-between;">
                <span>◢ MEDIAS24 • LE BOURSIER</span>
                <button class="refresh-btn" onclick="fetchAllData()">↻</button>
            </div>
            <div class="news-list" id="newsContainer">
                <div class="loading">Chargement des actualités...</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin.includes('localhost') ? 'http://localhost:5000' : 'https://risk-network-terminal.onrender.com';
        
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('fr-FR', {hour12: false});
        }
        setInterval(updateClock, 1000);
        updateClock();

        function getRatingClass(rating) {
            if (!rating || rating === '—' || rating === '-') return 'rating-none';
            const r = rating.toLowerCase();
            if (r.includes('strong buy')) return 'rating-strong-buy';
            if (r.includes('buy') && !r.includes('sell')) return 'rating-buy';
            if (r.includes('strong sell')) return 'rating-strong-sell';
            if (r.includes('sell')) return 'rating-sell';
            if (r.includes('hold')) return 'rating-hold';
            if (r.includes('neutral')) return 'rating-neutral';
            return 'rating-none';
        }

        function formatNumber(num) {
            if (!num || num === '—' || num === '-') return '—';
            return num;
        }

        async function fetchStocks() {
            const dot = document.getElementById('apiDot');
            const status = document.getElementById('apiStatus');
            const header = document.getElementById('stockHeader');
            
            dot.className = 'dot sync';
            status.textContent = 'SYNC...';
            
            try {
                const response = await fetch(`${API_BASE}/api/stocks`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const stocks = await response.json();
                console.log(`Loaded ${stocks.length} stocks`);
                
                renderStocks(stocks);
                
                dot.className = 'dot live';
                status.textContent = 'LIVE';
                
                const liveCount = stocks.filter(s => s.has_live_data).length;
                header.textContent = `◈ MASI ALL SHARES • ${liveCount}/${stocks.length} ACTIFS • ${new Date().toLocaleTimeString('fr-FR')}`;
                
            } catch (error) {
                console.error('Stocks error:', error);
                dot.className = 'dot offline';
                status.textContent = 'OFFLINE';
                document.getElementById('stockTableBody').innerHTML = 
                    `<tr><td colspan="11" class="error">ERREUR API: ${error.message}</td></tr>`;
            }
        }

        function renderStocks(stocks) {
            const tbody = document.getElementById('stockTableBody');
            if (!stocks || stocks.length === 0) {
                tbody.innerHTML = '<tr><td colspan="11" style="padding: 20px; text-align: center;">AUCUNE DONNÉE</td></tr>';
                return;
            }

            let html = '';
            
            stocks.forEach(stock => {
                const hasData = stock.has_live_data;
                const changeClass = stock.change_percent > 0 ? 'up' : stock.change_percent < 0 ? 'down' : 'neutral';
                const sign = stock.change_percent > 0 ? '+' : '';
                const ratingClass = getRatingClass(stock.rating);
                const ratingText = stock.rating || '—';
                
                if (hasData) {
                    html += `
                        <tr class="stock-row">
                            <td class="col-symbol">${stock.symbol}</td>
                            <td class="col-price">${stock.price.toFixed(2)}</td>
                            <td class="col-change-pct ${changeClass}">${sign}${stock.change_percent.toFixed(2)}%</td>
                            <td class="col-change ${changeClass}">${sign}${stock.change.toFixed(2)}</td>
                            <td class="col-rating"><span class="rating ${ratingClass}">${ratingText}</span></td>
                            <td class="col-volume">${formatNumber(stock.volume)}</td>
                            <td class="col-market-cap">${formatNumber(stock.market_cap)}</td>
                            <td class="col-pe">${stock.pe_ratio ? stock.pe_ratio.toFixed(2) : '—'}</td>
                            <td class="col-eps">${stock.eps ? stock.eps.toFixed(2) : '—'}</td>
                            <td class="col-employees">${formatNumber(stock.employees)}</td>
                            <td class="col-sector" title="${stock.sector}">${stock.sector}</td>
                        </tr>
                    `;
                } else {
                    html += `
                        <tr class="stock-row" style="opacity: 0.3;">
                            <td class="col-symbol" style="color: #444;">${stock.symbol}</td>
                            <td class="col-price no-data">—</td>
                            <td class="col-change-pct no-data">—</td>
                            <td class="col-change no-data">—</td>
                            <td class="col-rating"><span class="rating rating-none">—</span></td>
                            <td class="col-volume no-data">—</td>
                            <td class="col-market-cap no-data">—</td>
                            <td class="col-pe no-data">—</td>
                            <td class="col-eps no-data">—</td>
                            <td class="col-employees no-data">—</td>
                            <td class="col-sector no-data">—</td>
                        </tr>
                    `;
                }
            });
            tbody.innerHTML = html;
        }

        // Simple RSS Fetcher for Medias24 using AllOrigins proxy
        async function fetchNews() {
            const container = document.getElementById('newsContainer');
            container.innerHTML = '<div class="loading">Chargement...</div>';
            
            const RSS_URL = 'https://medias24.com/categorie/leboursier/actus/feed/';
            
            // Try multiple CORS proxies
            const proxies = [
                'https://api.allorigins.win/raw?url=',
                'https://api.codetabs.com/v1/proxy?quest=',
                'https://corsproxy.io/?'
            ];
            
            for (let proxy of proxies) {
                try {
                    const response = await fetch(proxy + encodeURIComponent(RSS_URL), {
                        headers: { 'Accept': 'application/rss+xml, application/xml, text/xml' }
                    });
                    
                    if (!response.ok) continue;
                    
                    const xmlText = await response.text();
                    const news = parseRSS(xmlText);
                    
                    if (news.length > 0) {
                        renderNews(news);
                        return;
                    }
                } catch (e) {
                    console.log(`Proxy failed: ${proxy}`, e);
                    continue;
                }
            }
            
            container.innerHTML = '<div class="error">Impossible de charger les actualités. CORS restriction.</div>';
        }

        function parseRSS(xmlText) {
            const parser = new DOMParser();
            const xml = parser.parseFromString(xmlText, 'text/xml');
            const items = xml.querySelectorAll('item');
            const news = [];
            
            items.forEach((item, index) => {
                if (index >= 6) return; // Only last 6 news
                
                const title = item.querySelector('title')?.textContent?.replace('<![CDATA[', '').replace(']]>', '') || 'Sans titre';
                const link = item.querySelector('link')?.textContent || '#';
                const pubDate = item.querySelector('pubDate')?.textContent || '';
                const category = item.querySelector('category')?.textContent?.replace('<![CDATA[', '').replace(']]>', '') || 'INFO';
                
                // Calculate relative time
                let timeText = 'maintenant';
                if (pubDate) {
                    const date = new Date(pubDate);
                    const now = new Date();
                    const diff = Math.floor((now - date) / 60000); // minutes
                    
                    if (diff < 60) timeText = `il y a ${diff}min`;
                    else if (diff < 1440) timeText = `il y a ${Math.floor(diff/60)}h`;
                    else timeText = `il y a ${Math.floor(diff/1440)}j`;
                }
                
                news.push({ title, link, timeText, category: category.toUpperCase() });
            });
            
            return news;
        }

        function renderNews(news) {
            const container = document.getElementById('newsContainer');
            let html = '';
            
            news.forEach(item => {
                html += `
                    <div class="news-item">
                        <div class="news-time">
                            <span>${item.timeText}</span>
                            <span class="news-cat">${item.category}</span>
                        </div>
                        <a href="${item.link}" target="_blank" class="news-title">${item.title}</a>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        async function fetchAllData() {
            await Promise.all([fetchStocks(), fetchNews()]);
        }

        // Initial load
        fetchAllData();
        
        // Auto refresh every 30 seconds
        setInterval(fetchAllData, 30000);
    </script>
</body>
</html>
