<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RISK NETWORK | Terminal Bourse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'JetBrains Mono', monospace; background-color: #000000; color: #00ff00; overflow-x: hidden; }
        
        /* Terminal Styling */
        .panel { border: 1px solid #1a1a1a; background: #050505; }
        .ticker-green { color: #00ff00; }
        .ticker-red { color: #ff3333; }
        .dim { color: #006600; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #004400; }
    </style>
</head>
<body class="p-4">
    <div class="flex justify-between items-center mb-4 border-b border-green-900 pb-2">
        <div>
            <h1 class="text-xl font-extrabold tracking-tighter uppercase">Risk Network Terminal</h1>
            <p class="text-[10px] dim">MARKET DATA SOURCE: BOURSE DE CASABLANCA / MEDIAS24</p>
        </div>
        <div class="text-right">
            <div id="clock" class="text-lg font-bold">00:00:00</div>
            <div class="text-[10px] bg-green-950 px-2 border border-green-800">SYSTEM: ONLINE</div>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <div class="lg:col-span-2 panel p-3">
            <div class="flex justify-between items-center mb-3 border-b border-green-900 pb-1">
                <span class="text-xs font-bold uppercase">Live Market Watch</span>
                <span class="text-[10px] dim" id="last-update-stocks">Waiting for data...</span>
            </div>
            <div class="overflow-x-auto h-[70vh]">
                <table class="w-full text-left text-xs">
                    <thead class="sticky top-0 bg-[#050505]">
                        <tr class="dim border-b border-green-900">
                            <th class="py-2">SYMBOL</th>
                            <th>NAME</th>
                            <th>PRICE (MAD)</th>
                            <th>CHANGE%</th>
                        </tr>
                    </thead>
                    <tbody id="stock-list">
                        </tbody>
                </table>
            </div>
        </div>

        <div class="panel p-3">
            <div class="flex justify-between items-center mb-3 border-b border-green-900 pb-1">
                <span class="text-xs font-bold uppercase">News: Medias24 LeBoursier</span>
                <span class="text-[10px] animate-pulse">● LIVE</span>
            </div>
            <div id="news-list" class="space-y-4 h-[70vh] overflow-y-auto pr-2">
                </div>
        </div>
    </div>

    <script>
        const API_BASE = "https://risk-network-terminal.onrender.com/api";

        function updateClock() {
            document.getElementById('clock').textContent = new Date().toLocaleTimeString('fr-FR');
        }

        async function fetchTerminalData() {
            try {
                const response = await fetch(`${API_BASE}/all`);
                const data = await response.json();

                // Render Stocks
                const stockList = document.getElementById('stock-list');
                stockList.innerHTML = data.stocks.map(s => `
                    <tr class="border-b border-green-950 hover:bg-zinc-900 transition-colors">
                        <td class="py-2 font-bold text-white">${s.symbol}</td>
                        <td class="text-[10px] dim truncate max-w-[150px]">${s.name}</td>
                        <td>${s.price.toLocaleString('fr-MA', { minimumFractionDigits: 2 })}</td>
                        <td class="${s.change >= 0 ? 'ticker-green' : 'ticker-red'} font-bold">
                            ${s.change >= 0 ? '+' : ''}${s.change.toFixed(2)}%
                        </td>
                    </tr>
                `).join('');
                
                document.getElementById('last-update-stocks').textContent = `UPDT: ${new Date().toLocaleTimeString()}`;

                // Render News
                const newsList = document.getElementById('news-list');
                newsList.innerHTML = data.news.map(n => `
                    <div class="border-l border-green-800 pl-3 py-1 group">
                        <div class="text-[9px] dim mb-1">${n.date.split(' ').slice(0, 4).join(' ')}</div>
                        <a href="${n.link}" target="_blank" class="block text-[13px] font-bold text-gray-200 hover:text-green-400 leading-tight transition">
                            ${n.title}
                        </a>
                        <p class="text-[10px] dim mt-1 leading-snug line-clamp-2">${n.summary}</p>
                    </div>
                `).join('');

            } catch (err) {
                console.error("Critical Sync Error:", err);
            }
        }

        // Initialize
        setInterval(updateClock, 1000);
        setInterval(fetchTerminalData, 60000); // Sync every minute
        fetchTerminalData();
    </script>
</body>
</html>
