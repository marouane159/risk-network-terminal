<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RISK NETWORK GROUP | Terminal Bourse [LIVE]</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --accent-color: #007bff;
            --table-border: #dee2e6;
            --positive: #28a745;
            --negative: #dc3545;
        }
        body.dark {
            --bg-color: #121212;
            --text-color: #ffffff;
            --accent-color: #0d6efd;
            --table-border: #444444;
            --positive: #198754;
            --negative: #dc3545;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h1 {
            margin: 0;
        }
        .controls {
            display: flex;
            gap: 10px;
        }
        select, button {
            padding: 5px 10px;
            border: 1px solid var(--table-border);
            background-color: var(--bg-color);
            color: var(--text-color);
            cursor: pointer;
        }
        #masi {
            font-size: 1.5em;
            margin-bottom: 10px;
        }
        #market-status {
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 40px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--table-border);
        }
        th {
            background-color: var(--accent-color);
            color: white;
        }
        .positive {
            color: var(--positive);
        }
        .negative {
            color: var(--negative);
        }
        #news ul {
            list-style: none;
            padding: 0;
        }
        #news li {
            margin-bottom: 10px;
        }
        #news a {
            color: var(--accent-color);
            text-decoration: none;
        }
        #news a:hover {
            text-decoration: underline;
        }
        .rtl {
            direction: rtl;
        }
    </style>
</head>
<body>
    <header>
        <h1 data-en="RISK NETWORK GROUP | Terminal Bourse [LIVE]" data-fr="GROUPE RISK NETWORK | Terminal Bourse [LIVE]" data-ar="مجموعة RISK NETWORK | محطة البورصة [مباشر]">RISK NETWORK GROUP | Terminal Bourse [LIVE]</h1>
        <div class="controls">
            <select id="language">
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="ar">العربية</option>
            </select>
            <button id="theme-toggle">🌙</button>
        </div>
    </header>
    <div id="masi"></div>
    <div id="market-status"></div>
    <h2 data-en="All Stocks" data-fr="Toutes les Actions" data-ar="جميع الأسهم">All Stocks</h2>
    <table id="stocks-table">
        <thead>
            <tr>
                <th data-en="Symbol" data-fr="Symbole" data-ar="الرمز">Symbol</th>
                <th data-en="Market Cap" data-fr="Capitalisation Boursière" data-ar="القيمة السوقية">Market Cap</th>
                <th data-en="Sector" data-fr="Secteur" data-ar="القطاع">Sector</th>
                <th data-en="Price" data-fr="Prix" data-ar="السعر">Price</th>
                <th data-en="Change %" data-fr="Changement %" data-ar="التغيير %">Change %</th>
                <th data-en="P/E" data-fr="P/E" data-ar="P/E">P/E</th>
                <th data-en="Analyst Rating" data-fr="Note des Analystes" data-ar="تقييم المحللين">Analyst Rating</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <h2 data-en="News" data-fr="Actualités" data-ar="الأخبار">News</h2>
    <div id="news">
        <ul></ul>
    </div>
    <script>
        const langTexts = document.querySelectorAll('[data-en]');
        let currentLang = 'en';

        function updateLanguage(lang) {
            currentLang = lang;
            langTexts.forEach(el => {
                el.textContent = el.getAttribute(`data-${lang}`) || el.getAttribute('data-en');
            });
            document.body.classList.toggle('rtl', lang === 'ar');
            document.documentElement.setAttribute('lang', lang);
        }

        document.getElementById('language').addEventListener('change', (e) => {
            updateLanguage(e.target.value);
        });

        const themeToggle = document.getElementById('theme-toggle');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark');
            themeToggle.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
        });

        function formatMarketCap(value) {
            if (value === '—' || value === null) return '—';
            if (value >= 1e9) return (value / 1e9).toFixed(2) + 'B';
            if (value >= 1e6) return (value / 1e6).toFixed(2) + 'M';
            return value.toFixed(2);
        }

        function formatChange(value) {
            if (value === '—') return '—';
            const sign = value > 0 ? '+' : '';
            return `${sign}${value.toFixed(2)}%`;
        }

        function formatPrice(value) {
            return value !== '—' ? value.toFixed(2) : '—';
        }

        function formatPE(value) {
            return value !== '—' ? value.toFixed(2) : '—';
        }

        function updateMasi(data) {
            const changeClass = data.change_percent > 0 ? 'positive' : data.change_percent < 0 ? 'negative' : '';
            document.getElementById('masi').innerHTML = `MASI: ${data.price.toFixed(2)} <span class="${changeClass}">${formatChange(data.change_percent)}</span>`;
        }

        function updateMarketStatus(data) {
            const status = data.is_open ? 'Open' : 'Closed';
            document.getElementById('market-status').innerHTML = `Market Status: ${status} | Hours: ${data.open_time} - ${data.close_time} (Mon-Fri) | Next Open: ${data.next_open}`;
        }

        function updateStocks(stocks) {
            const tbody = document.querySelector('#stocks-table tbody');
            tbody.innerHTML = '';
            stocks.forEach(stock => {
                const row = document.createElement('tr');
                const changeClass = stock.change > 0 ? 'positive' : stock.change < 0 ? 'negative' : '';
                row.innerHTML = `
                    <td>${stock.symbol}</td>
                    <td>${formatMarketCap(stock.market_cap)}</td>
                    <td>${stock.sector}</td>
                    <td>${formatPrice(stock.price)}</td>
                    <td class="${changeClass}">${formatChange(stock.change)}</td>
                    <td>${formatPE(stock.pe)}</td>
                    <td>${stock.rating}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function updateNews(news) {
            const ul = document.querySelector('#news ul');
            ul.innerHTML = '';
            news.forEach(item => {
                const li = document.createElement('li');
                li.innerHTML = `<a href="${item.link}" target="_blank">${item.title}</a> (${item.pub_date})`;
                ul.appendChild(li);
            });
        }

        async function fetchData() {
            try {
                const [masi, stocks, news, status] = await Promise.all([
                    fetch('/api/masi').then(res => res.json()),
                    fetch('/api/stocks').then(res => res.json()),
                    fetch('/api/news').then(res => res.json()),
                    fetch('/api/market_status').then(res => res.json())
                ]);
                updateMasi(masi);
                updateStocks(stocks);
                updateNews(news);
                updateMarketStatus(status);
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        // Initial fetch
        fetchData();

        // Auto refresh every 10 minutes
        setInterval(fetchData, 600000);

        // Initial language
        updateLanguage('en');
    </script>
</body>
</html>
