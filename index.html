<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Morocco Stock Terminal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #0f1116;
    color: white;
}

header {
    padding: 15px;
    background: #151924;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

button, select {
    padding: 5px 10px;
    margin-left: 10px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 8px;
    border-bottom: 1px solid #333;
    text-align: left;
}

th {
    background: #1c2230;
}

.green { color: #00ff88; }
.red { color: #ff4c4c; }

.news {
    padding: 15px;
    background: #151924;
}

.light {
    background: #ffffff;
    color: #000;
}

.light header, .light .news {
    background: #f4f4f4;
}

</style>
</head>
<body>

<header>
    <div>
        <h2>Moroccan Market Terminal</h2>
        <div id="masi"></div>
        <div id="marketStatus"></div>
    </div>
    <div>
        <select id="language">
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="ar">العربية</option>
        </select>
        <button onclick="toggleTheme()">Dark/Light</button>
    </div>
</header>

<div class="news">
    <h3>Latest News</h3>
    <ul id="newsList"></ul>
</div>

<table>
    <thead>
        <tr>
            <th>Symbol</th>
            <th>Market Cap</th>
            <th>Sector</th>
            <th>Price</th>
            <th>Change %</th>
            <th>P/E</th>
            <th>Analyst Rating</th>
        </tr>
    </thead>
    <tbody id="stockTable"></tbody>
</table>

<script>
const API_URL = "/api/data";

function fetchData() {
    fetch(API_URL)
    .then(res => res.json())
    .then(data => {

        // MASI
        if (data.masi && data.masi.price) {
            document.getElementById("masi").innerHTML =
                "MASI: " + data.masi.price +
                " (" + data.masi.change + "%)";
        }

        // Market status
        updateMarketStatus();

        // Stocks
        const table = document.getElementById("stockTable");
        table.innerHTML = "";

        data.stocks.forEach(stock => {
            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${stock.symbol}</td>
                <td>${formatNumber(stock.market_cap)}</td>
                <td>${stock.sector || "-"}</td>
                <td>${stock.price}</td>
                <td class="${stock.change >= 0 ? 'green':'red'}">${stock.change}%</td>
                <td>${stock.pe || "-"}</td>
                <td>${stock.rating || "-"}</td>
            `;

            table.appendChild(row);
        });

        // News
        const newsList = document.getElementById("newsList");
        newsList.innerHTML = "";
        data.news.forEach(n => {
            const li = document.createElement("li");
            li.innerHTML = `<a href="${n.link}" target="_blank">${n.title}</a>`;
            newsList.appendChild(li);
        });

    });
}

function formatNumber(num) {
    if (!num) return "-";
    return num.toLocaleString();
}

function updateMarketStatus() {
    const now = new Date();
    const day = now.getDay();
    const hours = now.getHours();
    const minutes = now.getMinutes();

    const open = (day >= 1 && day <= 5) &&
                 (hours > 9 || (hours === 9 && minutes >= 30)) &&
                 (hours < 15 || (hours === 15 && minutes <= 40));

    document.getElementById("marketStatus").innerHTML =
        "Market Hours: 09:30 - 15:40 | " +
        (open ? "<span class='green'>OPEN</span>" :
                "<span class='red'>CLOSED</span>");
}

function toggleTheme() {
    document.body.classList.toggle("light");
}

setInterval(fetchData, 600000); // 10 minutes
fetchData();
</script>

</body>
</html>
