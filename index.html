<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>RISK NETWORK | TERMINAL LIVE</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #000; color: #ff6600; font-family: 'JetBrains Mono', monospace; margin: 0; padding: 15px; }
        .header-bar { border-bottom: 2px solid #ff6600; padding-bottom: 10px; margin-bottom: 20px; font-weight: 800; }
        
        /* Grid Alignment Fix */
        .stock-row {
            display: grid;
            grid-template-columns: 100px 120px 120px 80px 140px;
            padding: 10px;
            border-bottom: 1px solid #222;
            font-size: 12px;
            align-items: center;
        }
        .header-row { color: #888; font-size: 11px; text-transform: uppercase; border-bottom: 2px solid #333; }
        .ticker { color: #fff; font-weight: bold; }
        .up { color: #00ff41; }
        .down { color: #ff4444; }
        .rating { background: #222; padding: 3px 8px; border-radius: 4px; font-size: 10px; text-align: center; }
    </style>
</head>
<body>

<div class="header-bar">▶ RISK NETWORK GROUP TERMINAL | LIVE BOURSE MAROC</div>

<div class="stock-row header-row">
    <div>Ticker</div>
    <div>Cours</div>
    <div>Variation</div>
    <div>P/E</div>
    <div>Recommandation</div>
</div>

<div id="stock-container">
    <div style="padding: 20px;">Synchronisation en cours...</div>
</div>

<script>
    // Replace this with your ACTUAL Render URL
    const API_URL = 'https://risk-network-terminal.onrender.com/api/stocks';

    async function fetchStocks() {
        try {
            const response = await fetch(API_URL);
            const stocks = await response.json();
            const container = document.getElementById('stock-container');
            
            container.innerHTML = stocks.map(stock => {
                const isUp = stock.change.includes('+');
                const colorClass = isUp ? 'up' : stock.change.includes('-') ? 'down' : '';
                
                return `
                    <div class="stock-row">
                        <div class="ticker">${stock.ticker}</div>
                        <div>${stock.price}</div>
                        <div class="${colorClass}">${stock.change}</div>
                        <div>${stock.pe}</div>
                        <div><span class="rating">${stock.rating}</span></div>
                    </div>
                `;
            }).join('');
        } catch (error) {
            console.error("API Error:", error);
            document.getElementById('stock-container').innerHTML = '<div style="color: red;">Erreur de connexion au serveur Render.</div>';
        }
    }

    // Initial Load
    fetchStocks();
    
    // Auto-refresh every 60 seconds
    setInterval(fetchStocks, 60000);
</script>

</body>
</html>
