<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RISK NETWORK GROUP | Terminal Bourse [LIVE]</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'JetBrains Mono', monospace;
            background: #000;
            color: #e0e0e0;
            font-size: 14px;
            line-height: 1.4;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(90deg, #000 0%, #1a0f00 100%);
            border-bottom: 2px solid #ff6600;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 50px;
        }
        .logo { color: #ff6600; font-weight: 800; font-size: 18px; letter-spacing: 2px; }
        .status { display: flex; gap: 20px; font-size: 12px; }
        .dot { width: 8px; height: 8px; background: #333; display: inline-block; }
        .dot.live { background: #00ff41; box-shadow: 0 0 8px #00ff41; }
        .dot.offline { background: #ff0000; }
        .dot.sync { background: #ffaa00; animation: pulse 1s infinite; }
        
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        .container { 
            display: grid; 
            grid-template-columns: 1fr 400px; 
            height: calc(100vh - 50px);
        }
        
        .stocks-panel { 
            border-right: 1px solid #222; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
        }
        .panel-header {
            background: #0a0a0a;
            border-bottom: 1px solid #333;
            padding: 8px 15px;
            font-size: 11px;
            color: #ff6600;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }
        .stock-table { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 13px;
        }
        .stock-table th {
            background: #111;
            color: #666;
            font-weight: 400;
            text-align: left;
            padding: 10px 15px;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
        }
        .stock-table td {
            padding: 10px 15px;
            border-bottom: 1px solid #1a1a1a;
        }
        .stock-row:hover { background: #1a0f00; cursor: pointer; }
        .symbol { color: #fff; font-weight: 700; font-size: 14px; }
        .price { text-align: right; color: #fff; font-weight: 700; font-size: 14px; }
        .change { text-align: right; font-weight: 700; font-size: 14px; }
        .change.up { color: #00ff41; }
        .change.down { color: #ff6600; }
        .change.neutral { color: #888; }
        
        .news-panel { 
            background: #050505; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
        }
        .news-list {
            overflow-y: auto;
            flex: 1;
        }
        .news-item {
            padding: 12px 15px;
            border-bottom: 1px solid #1a1a1a;
            font-size: 12px;
            line-height: 1.4;
        }
        .news-item:hover { background: #1a0f00; }
        .news-time { 
            color: #ff6600; 
            font-size: 10px; 
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }
        .news-title { 
            color: #ccc; 
            text-decoration: none; 
            display: block;
            font-weight: 500;
            margin-bottom: 3px;
        }
        .news-title:hover { color: #fff; text-decoration: underline; }
        .news-cat { 
            color: #666; 
            font-size: 10px; 
            background: #1a1a1a;
            padding: 2px 6px;
            display: inline-block;
        }
        
        .loading { 
            color: #ff6600; 
            padding: 20px; 
            text-align: center; 
            font-size: 12px; 
            animation: pulse 1.5s infinite; 
        }
        .error { 
            color: #ff0000; 
            padding: 15px; 
            font-size: 11px; 
            border-left: 3px solid #ff0000; 
            margin: 10px; 
            background: #1a0000; 
        }
        .refresh-btn {
            background: #ff6600;
            color: #000;
            border: none;
            padding: 4px 10px;
            font-family: inherit;
            font-size: 11px;
            cursor: pointer;
            font-weight: 700;
        }
        .refresh-btn:hover { background: #ff8833; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; }
        ::-webkit-scrollbar-thumb:hover { background: #ff6600; }
        
        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; grid-template-rows: 1fr 300px; }
            .stocks-panel { border-right: none; border-bottom: 1px solid #333; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">▶ RISK NETWORK GROUP</div>
        <div class="status">
            <div class="status-item">
                <span class="dot" id="apiDot"></span>
                <span id="apiStatus">CONNECTING...</span>
            </div>
            <div class="status-item" id="clock">00:00:00</div>
        </div>
    </div>

    <div class="container">
        <!-- Stocks Panel -->
        <div class="stocks-panel">
            <div class="panel-header">◈ COURS EN TEMPS RÉEL • BOURSE DE CASABLANCA</div>
            <div style="overflow-y: auto; flex: 1;">
                <table class="stock-table">
                    <thead>
                        <tr>
                            <th style="width: 30%">TICKER</th>
                            <th style="width: 35%; text-align: right">PRIX (MAD)</th>
                            <th style="width: 35%; text-align: right">VAR %</th>
                        </tr>
                    </thead>
                    <tbody id="stockTableBody">
                        <tr><td colspan="3" class="loading">CONNEXION AU SERVEUR...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- News Panel -->
        <div class="news-panel">
            <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center;">
                <span>◢ ACTUALITÉS • MEDIAS24</span>
                <button class="refresh-btn" onclick="fetchData()">↻ RAFRAICHIR</button>
            </div>
            <div class="news-list" id="newsContainer">
                <div class="loading">CHARGEMENT...</div>
            </div>
        </div>
    </div>

    <script>
        // API Configuration
        const API_BASE = window.location.origin.includes('localhost') 
            ? 'http://localhost:5000' 
            : 'https://risk-network-terminal.onrender.com';
        
        // Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('fr-FR', {hour12: false});
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Fetch all data
        async function fetchData() {
            const dot = document.getElementById('apiDot');
            const status = document.getElementById('apiStatus');
            
            dot.className = 'dot sync';
            status.textContent = 'SYNC...';
            
            try {
                // Fetch both stocks and news
                const response = await fetch(`${API_BASE}/api/all`);
                if (!response.ok) throw new Error('API Error');
                
                const data = await response.json();
                
                renderStocks(data.stocks);
                renderNews(data.news);
                
                dot.className = 'dot live';
                status.textContent = 'LIVE';
                
            } catch (error) {
                console.error('Error:', error);
                dot.className = 'dot offline';
                status.textContent = 'OFFLINE';
                
                document.getElementById('stockTableBody').innerHTML = 
                    '<tr><td colspan="3" class="error">ERREUR: SERVEUR INACCESSIBLE<br>Vérifiez votre connexion</td></tr>';
                document.getElementById('newsContainer').innerHTML = 
                    '<div class="error">ERREUR DE CHARGEMENT</div>';
            }
        }

        function renderStocks(stocks) {
            const tbody = document.getElementById('stockTableBody');
            
            if (!stocks || stocks.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="padding: 20px; color: #666; text-align: center;">AUCUNE DONNÉE DISPONIBLE</td></tr>';
                return;
            }

            let html = '';
            stocks.forEach(stock => {
                if (stock.price === 0 && stock.change === 0) return; // Skip empty stocks
                
                const changeClass = stock.change > 0 ? 'up' : stock.change < 0 ? 'down' : 'neutral';
                const sign = stock.change > 0 ? '+' : '';
                
                html += `
                    <tr class="stock-row">
                        <td class="symbol">${stock.symbol}</td>
                        <td class="price">${stock.price.toFixed(2)}</td>
                        <td class="change ${changeClass}">${sign}${stock.change.toFixed(2)}%</td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        function renderNews(news) {
            const container = document.getElementById('newsContainer');
            
            if (!news || news.length === 0) {
                container.innerHTML = '<div class="loading">AUCUNE ACTUALITÉ</div>';
                return;
            }

            let html = '';
            news.forEach(item => {
                const timeText = item.time < 60 ? `${item.time}min` : 
                                item.time < 1440 ? `${Math.floor(item.time/60)}h` : 
                                `${Math.floor(item.time/1440)}j`;
                
                html += `
                    <div class="news-item">
                        <div class="news-time">
                            <span>il y a ${timeText}</span>
                            <span class="news-cat">${item.category}</span>
                        </div>
                        <a href="${item.link}" target="_blank" class="news-title">${item.title}</a>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // Initial load
        fetchData();
        
        // Auto refresh every 30 seconds
        setInterval(fetchData, 30000);
    </script>
</body>
</html>
