<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RISK NETWORK GROUP | Terminal Bourse [LIVE]</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --bg-tertiary: #111111;
            --text-primary: #e0e0e0;
            --text-secondary: #888888;
            --text-muted: #555555;
            --accent: #ff6600;
            --accent-light: #ff8833;
            --up: #00ff41;
            --down: #ff4444;
            --border: #222222;
        }
        
        [data-theme="light"] {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-tertiary: #eeeeee;
            --text-primary: #1a1a1a;
            --text-secondary: #555555;
            --text-muted: #888888;
            --accent: #e55a00;
            --accent-light: #ff6b1a;
            --up: #00aa00;
            --down: #cc0000;
            --border: #dddddd;
        }
        
        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 12px;
            line-height: 1.4;
            height: 100vh;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }
        
        /* Header */
        .header {
            background: linear-gradient(90deg, var(--bg-primary) 0%, rgba(255,102,0,0.1) 100%);
            border-bottom: 2px solid var(--accent);
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 50px;
        }
        
        .logo {
            color: var(--accent);
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 1px;
        }
        
        .header-center {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .masi-display {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 12px;
            background: var(--bg-secondary);
            border-radius: 4px;
            border: 1px solid var(--border);
        }
        
        .masi-label {
            color: var(--text-muted);
            font-size: 10px;
        }
        
        .masi-value {
            font-weight: 700;
            font-size: 13px;
        }
        
        .masi-change {
            font-size: 11px;
            font-weight: 600;
        }
        
        .market-status {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
        }
        
        .market-open {
            background: rgba(0, 255, 65, 0.1);
            color: var(--up);
            border: 1px solid rgba(0, 255, 65, 0.3);
        }
        
        .market-closed {
            background: rgba(255, 68, 68, 0.1);
            color: var(--down);
            border: 1px solid rgba(255, 68, 68, 0.3);
        }
        
        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .control-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
            transition: all 0.2s;
        }
        
        .control-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        
        .status-live { background: var(--up); box-shadow: 0 0 8px var(--up); }
        .status-sync { background: #ffaa00; animation: pulse 1s infinite; }
        .status-offline { background: var(--down); }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .clock {
            font-size: 11px;
            color: var(--text-secondary);
        }
        
        /* Main Container */
        .container {
            display: grid;
            grid-template-columns: 1fr 320px;
            height: calc(100vh - 50px);
        }
        
        /* Stocks Panel */
        .stocks-panel {
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .panel-header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .panel-title {
            color: var(--accent);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .panel-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .last-update {
            color: var(--text-muted);
            font-size: 10px;
        }
        
        .refresh-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 4px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-family: inherit;
            font-size: 10px;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .refresh-btn:hover {
            background: var(--accent-light);
        }
        
        /* Table */
        .table-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }
        
        .stocks-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
        }
        
        .stocks-table thead {
            position: sticky;
            top: 0;
            background: var(--bg-secondary);
            z-index: 10;
        }
        
        .stocks-table th {
            padding: 8px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        
        .stocks-table td {
            padding: 10px 10px;
            border-bottom: 1px solid var(--border);
        }
        
        .stock-row {
            transition: background 0.2s;
        }
        
        .stock-row:hover {
            background: var(--bg-tertiary);
        }
        
        .stock-row.inactive {
            opacity: 0.5;
        }
        
        .symbol {
            color: var(--accent);
            font-weight: 700;
        }
        
        .sector {
            color: var(--text-secondary);
            font-size: 10px;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .capital {
            color: var(--text-secondary);
            font-size: 10px;
        }
        
        .price {
            font-weight: 700;
        }
        
        .change {
            font-weight: 600;
        }
        
        .change.up { color: var(--up); }
        .change.down { color: var(--down); }
        .change.neutral { color: var(--text-muted); }
        
        .pe {
            color: var(--text-secondary);
        }
        
        .rating {
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .rating-strong-buy { background: rgba(0, 255, 65, 0.2); color: var(--up); }
        .rating-buy { background: rgba(0, 200, 100, 0.15); color: #00cc66; }
        .rating-hold { background: rgba(255, 170, 0, 0.15); color: #ffaa00; }
        .rating-sell { background: rgba(255, 68, 68, 0.15); color: #ff6666; }
        .rating-strong-sell { background: rgba(255, 68, 68, 0.2); color: var(--down); }
        .rating-neutral { background: var(--bg-tertiary); color: var(--text-muted); }
        .rating-none { color: var(--text-muted); }
        
        /* News Panel */
        .news-panel {
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            overflow: hidden;
        }
        
        .news-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }
        
        .news-item {
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        
        .news-item:last-child {
            border-bottom: none;
        }
        
        .news-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        
        .news-time {
            color: var(--text-muted);
            font-size: 9px;
        }
        
        .news-category {
            background: var(--accent);
            color: #000;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 8px;
            font-weight: 700;
        }
        
        .news-title {
            display: block;
            color: var(--text-primary);
            text-decoration: none;
            line-height: 1.5;
            font-size: 11px;
            transition: color 0.2s;
        }
        
        .news-title:hover {
            color: var(--accent);
        }
        
        .loading, .error, .no-data {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 11px;
        }
        
        .error {
            color: var(--down);
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }
        
        /* Market Hours Info */
        .market-hours {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 10px;
        }
        
        .market-hours-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        
        .market-hours-label {
            color: var(--text-muted);
            font-size: 9px;
        }
        
        .market-hours-value {
            color: var(--text-primary);
            font-weight: 600;
        }
        
        .next-open {
            font-size: 9px;
            color: var(--text-muted);
            margin-left: 8px;
        }
    </style>
</head>
<body data-theme="dark">
    <!-- Header -->
    <div class="header">
        <div class="logo">
            ⚡ RISK NETWORK GROUP
        </div>
        
        <div class="header-center">
            <div id="masiDisplay" class="masi-display" style="display: none;">
                <span class="masi-label">MASI</span>

            <select id="langSelect" class="control-btn">
                <option value="fr">Français</option>

    <div class="container">
        <!-- Stocks Panel -->
        <div class="stocks-panel">

                <div class="panel-actions">

                <table class="stocks-table">
                    <thead>
                        <tr>
                            <th id="colSymbol">SYMBOLE</th>
                            <th id="colSector">SECTEUR</th>
                            <th id="colCap">CAP.</th>
                            <th id="colPrice">PRIX</th>
                            <th id="colChange">VAR %</th>
                            <th id="colPE">P/E</th>
                            <th id="colRating">RATING</th>
                        </tr>
                    </thead>
                    <tbody id="stockTableBody">
                        <tr><td colspan="7" id="loadingMsg" class="loading">Chargement des données...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <!-- News Panel -->
        <div class="news-panel">
            <div class="panel-header">
                <span class="panel-title">📰 ACTUALITÉS BOURSE</span>
            </div>
            <div class="news-container" id="newsList">
                <div id="newsLoading" class="loading">Chargement des actualités...</div>
            </div>
        </div>
    </div>
    
    <script>
        // API Configuration - CRITICAL: Use your Render backend URL
        const API_BASE = 'https://risk-network-terminal.onrender.com';
        
        // State
        let currentLang = 'fr';
        let currentTheme = 'dark';
        let stocksData = [];
        let newsData = [];
        let masiData = null;
        let marketStatusData = null;
        
        // Translations
        const translations = {
            fr: {
                stocksTitle: 'ACTIONS CASABLANCA',
                symbol: 'SYMBOLE',
                sector: 'SECTEUR',
                cap: 'CAP.',
                price: 'PRIX',
                change: 'VAR %',
                pe: 'P/E',
                rating: 'RATING',
                hours: 'HEURES',
                days: 'JOURS',
                refresh: '↻ ACTUALISER',
                loading: 'Chargement...',
                live: 'LIVE',
                sync: 'SYNC...',
                offline: 'HORS LIGNE',
                marketOpen: 'OUVERT',
                marketClosed: 'FERMÉ',
                nextOpen: 'Prochain:',
                minutes: 'min',
                hours_ago: 'h',
                days_ago: 'j',
                strongBuy: 'ACHAT FORT',
                buy: 'ACHAT',
                hold: 'CONSERVER',
                sell: 'VENTE',
                strongSell: 'VENTE FORTE',
                neutral: 'NEUTRE'
            },
            en: {
                stocksTitle: 'CASABLANCA STOCKS',
                symbol: 'SYMBOL',
                sector: 'SECTOR',
                cap: 'CAP.',
                price: 'PRICE',
                change: 'CHG %',
                pe: 'P/E',
                rating: 'RATING',
                hours: 'HOURS',
                days: 'DAYS',
                refresh: '↻ REFRESH',
                loading: 'Loading...',
                live: 'LIVE',
                sync: 'SYNC...',
                offline: 'OFFLINE',
                marketOpen: 'OPEN',
                marketClosed: 'CLOSED',
                nextOpen: 'Next:',
                minutes: 'm',
                hours_ago: 'h',
                days_ago: 'd',
                strongBuy: 'STRONG BUY',
                buy: 'BUY',
                hold: 'HOLD',
                sell: 'SELL',
                strongSell: 'STRONG SELL',
                neutral: 'NEUTRAL'
            },
            ar: {
                stocksTitle: 'أسهم الدار البيضاء',
                symbol: 'الرمز',
                sector: 'القطاع',
                cap: 'القيمة',
                price: 'السعر',
                change: 'التغير %',
                pe: 'P/E',
                rating: 'التقييم',
                hours: 'الساعات',
                days: 'الأيام',
                refresh: '↻ تحديث',
                loading: 'جار التحميل...',
                live: 'مباشر',
                sync: 'مزامنة...',
                offline: 'غير متصل',
                marketOpen: 'مفتوح',
                marketClosed: 'مغلق',
                nextOpen: 'القادم:',
                minutes: 'د',
                hours_ago: 'س',
                days_ago: 'ي',
                strongBuy: 'شراء قوي',
                buy: 'شراء',
                hold: 'احتفاظ',
                sell: 'بيع',
                strongSell: 'بيع قوي',
                neutral: 'محايد'
            }
        };
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Initializing RISK Network Terminal...');
            console.log('API Base URL:', API_BASE);
            
            // Event listeners
            document.getElementById('langSelect').addEventListener('change', (e) => {
                currentLang = e.target.value;
                updateTranslations();
                renderStocks();
                renderNews();
            });
            
            document.getElementById('themeBtn').addEventListener('click', toggleTheme);
            document.getElementById('refreshBtn').addEventListener('click', fetchAllData);
            
            // Initial fetch
            fetchAllData();
            
            // Auto-refresh every 10 minutes
            setInterval(fetchAllData, 600000);
            
            // Update clock every second
            setInterval(updateClock, 1000);
            updateClock();
        });
        
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString(currentLang === 'ar' ? 'ar-MA' : currentLang === 'fr' ? 'fr-FR' : 'en-US', { hour12: false });
            document.getElementById('clock').textContent = timeString;
        }
        
        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', currentTheme);
            document.getElementById('themeBtn').textContent = currentTheme === 'dark' ? '☀️' : '🌙';
        }
        
        function updateTranslations() {
            const t = translations[currentLang];
            document.getElementById('stocksTitle').textContent = t.stocksTitle;
            document.getElementById('colSymbol').textContent = t.symbol;
            document.getElementById('colSector').textContent = t.sector;
            document.getElementById('colCap').textContent = t.cap;
            document.getElementById('colPrice').textContent = t.price;
            document.getElementById('colChange').textContent = t.change;
            document.getElementById('colPE').textContent = t.pe;
            document.getElementById('colRating').textContent = t.rating;
            document.getElementById('hoursLabel').textContent = t.hours;
            document.getElementById('daysLabel').textContent = t.days;
            document.getElementById('refreshBtn').textContent = t.refresh;
            document.getElementById('loadingMsg').textContent = t.loading;
            document.getElementById('newsLoading').textContent = t.loading;
            
            if (marketStatusData) {
                updateMarketStatus(marketStatusData);
            }
        }
        
        async function fetchAllData() {
            setStatus('sync');
            console.log('Fetching data from:', `${API_BASE}/api/all`);
            
            try {
                const response = await fetch(`${API_BASE}/api/all`);
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log('Data received:', data);
                
                stocksData = data.stocks || [];
                newsData = data.news || [];
                masiData = data.masi;
                marketStatusData = data.market_status;
                
                console.log('Stocks:', stocksData.length);
                console.log('News:', newsData.length);
                console.log('MASI:', masiData);
                
                renderStocks();
                renderNews();
                renderMasi();
                updateMarketStatus(marketStatusData);
                
                if (data.last_update) {
                    const date = new Date(data.last_update);
                    document.getElementById('lastUpdate').textContent = date.toLocaleTimeString();
                }
                
                setStatus('live');
            } catch (error) {
                console.error('Fetch error:', error);
                setStatus('offline');
                
                // Show error in table
                const t = translations[currentLang];
                document.getElementById('stockTableBody').innerHTML = 
                    `<tr><td colspan="7" class="error">❌ ${t.offline}<br><small>${error.message}</small><br><small>Backend URL: ${API_BASE}</small></td></tr>`;
            }
        }
        
        function setStatus(status) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            const t = translations[currentLang];
            
            dot.className = 'status-dot';
            
            if (status === 'live') {
                dot.classList.add('status-live');
                text.textContent = t.live;
            } else if (status === 'sync') {
                dot.classList.add('status-sync');
                text.textContent = t.sync;
            } else {
                dot.classList.add('status-offline');
                text.textContent = t.offline;
            }
        }
        
        function renderMasi() {
            if (!masiData) {
                console.log('No MASI data');
                return;
            }
            
            console.log('Rendering MASI:', masiData);
            
            const display = document.getElementById('masiDisplay');
            const price = document.getElementById('masiPrice');
            const change = document.getElementById('masiChange');
            
            display.style.display = 'flex';
            price.textContent = masiData.price.toFixed(2);
            
            const changeValue = masiData.change_percent || 0;
            const sign = changeValue >= 0 ? '+' : '';
            change.textContent = `${sign}${changeValue.toFixed(2)}%`;
            change.style.color = changeValue >= 0 ? 'var(--up)' : 'var(--down)';
        }
        
        function updateMarketStatus(status) {
            const t = translations[currentLang];
            const dot = document.getElementById('marketDot');
            const text = document.getElementById('marketText');
            const container = document.getElementById('marketStatus');
            const nextOpen = document.getElementById('nextOpen');
            
            if (status.is_open) {
                container.className = 'market-status market-open';
                text.textContent = t.marketOpen;
                nextOpen.textContent = '';
            } else {
                container.className = 'market-status market-closed';
                text.textContent = t.marketClosed;
                nextOpen.textContent = `${t.nextOpen} ${status.next_open}`;
            }
        }
        
        function renderStocks() {
            const tbody = document.getElementById('stockTableBody');
            const t = translations[currentLang];
            
            console.log('Rendering stocks:', stocksData.length);
            
            if (stocksData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="no-data">${t.loading}</td></tr>`;
                return;
            }
            
            let html = '';
            
            stocksData.forEach(stock => {
                const hasData = stock.has_live_data;
                const changeClass = stock.change > 0 ? 'up' : stock.change < 0 ? 'down' : 'neutral';
                const sign = stock.change > 0 ? '+' : '';
                const peDisplay = stock.pe ? stock.pe.toFixed(1) : '—';
                const ratingClass = getRatingClass(stock.rating);
                const ratingText = getRatingText(stock.rating, t);
                
                html += `
                    <tr class="stock-row ${hasData ? '' : 'inactive'}">
                        <td class="symbol">${stock.symbol}</td>
                        <td class="sector" title="${stock.sector}">${stock.sector}</td>
                        <td class="capital">${stock.capital}</td>
                        <td class="price">${hasData ? stock.price.toFixed(2) : '—'}</td>
                        <td class="change ${changeClass}">${hasData ? sign + stock.change.toFixed(2) + '%' : '—'}</td>
                        <td class="pe">${peDisplay}</td>
                        <td><span class="rating ${ratingClass}">${ratingText}</span></td>
                    </tr>
                `;
            });
            
            tbody.innerHTML = html;
            
            // Update title with count
            const liveCount = stocksData.filter(s => s.has_live_data).length;
            document.getElementById('stocksTitle').textContent = `${t.stocksTitle} • ${liveCount}/${stocksData.length}`;
        }
        
        function getRatingClass(rating) {
            if (!rating || rating === '—') return 'rating-none';
            const r = rating.toLowerCase();
            if (r.includes('strong buy') || r.includes('achat fort') || r.includes('شراء قوي')) return 'rating-strong-buy';
            if (r.includes('buy') || r.includes('achat') || r.includes('شراء')) return 'rating-buy';
            if (r.includes('strong sell') || r.includes('vente fort') || r.includes('بيع قوي')) return 'rating-strong-sell';
            if (r.includes('sell') || r.includes('vente') || r.includes('بيع')) return 'rating-sell';
            if (r.includes('hold') || r.includes('conserver') || r.includes('احتفاظ')) return 'rating-hold';
            return 'rating-neutral';
        }
        
        function getRatingText(rating, t) {
            if (!rating || rating === '—') return '—';
            const r = rating.toLowerCase();
            if (r.includes('strong buy')) return t.strongBuy;
            if (r.includes('buy') && !r.includes('sell')) return t.buy;
            if (r.includes('strong sell')) return t.strongSell;
            if (r.includes('sell')) return t.sell;
            if (r.includes('hold')) return t.hold;
            return t.neutral;
        }
        
        function renderNews() {
            const container = document.getElementById('newsList');
            const t = translations[currentLang];
            
            console.log('Rendering news:', newsData.length);
            
            if (newsData.length === 0) {
                container.innerHTML = `<div class="loading">${t.loading}</div>`;
                return;
            }
            
            let html = '';
            
            newsData.slice(0, 8).forEach(item => {
                const timeText = formatTimeAgo(item.time, t);
                
                html += `
                    <div class="news-item">
                        <div class="news-meta">
                            <span class="news-time">${timeText}</span>
                            <span class="news-category">${item.category}</span>
                        </div>
                        <a href="${item.link}" target="_blank" class="news-title">${item.title}</a>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        function formatTimeAgo(minutes, t) {
            if (minutes < 60) return `${minutes}${t.minutes}`;
            if (minutes < 1440) return `${Math.floor(minutes / 60)}${t.hours_ago}`;
            return `${Math.floor(minutes / 1440)}${t.days_ago}`;
        }
    </script>
</body>
</html>
