<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RISK NETWORK GROUP | Terminal Bourse [LIVE]</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'JetBrains Mono', monospace;
            background: #000;
            color: #e0e0e0;
            font-size: 12px;
            line-height: 1.4;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(90deg, #000 0%, #1a0f00 100%);
            border-bottom: 2px solid #ff6600;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 45px;
        }
        .logo { color: #ff6600; font-weight: 800; font-size: 16px; letter-spacing: 1px; }
        
        .social-bar {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .social-link {
            color: #666;
            text-decoration: none;
            font-size: 10px;
            border: 1px solid #333;
            padding: 3px 6px;
            transition: all 0.3s;
        }
        .social-link:hover {
            color: #ff6600;
            border-color: #ff6600;
            background: rgba(255, 102, 0, 0.1);
        }
        .website-link {
            color: #000;
            background: #ff6600;
            border-color: #ff6600;
            font-weight: 700;
        }
        
        .status { display: flex; gap: 15px; font-size: 11px; align-items: center; }
        .dot { width: 6px; height: 6px; background: #333; display: inline-block; }
        .dot.live { background: #00ff41; box-shadow: 0 0 6px #00ff41; }
        .dot.offline { background: #ff0000; }
        .dot.sync { background: #ffaa00; animation: pulse 1s infinite; }
        
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        .container { display: grid; grid-template-columns: 1fr 320px; height: calc(100vh - 45px); }
        
        .stocks-panel { border-right: 1px solid #222; overflow: hidden; display: flex; flex-direction: column; }
        .panel-header {
            background: #0a0a0a;
            border-bottom: 1px solid #333;
            padding: 6px 10px;
            font-size: 10px;
            color: #ff6600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* Table Styles */
        .stock-table { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 11px;
        }
        .stock-table th {
            background: #111;
            color: #666;
            font-weight: 400;
            text-align: left;
            padding: 6px 4px;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            font-size: 10px;
            white-space: nowrap;
        }
        .stock-table td {
            padding: 5px 4px;
            border-bottom: 1px solid #1a1a1a;
            white-space: nowrap;
        }
        .stock-row:hover { background: #1a0f00; cursor: pointer; }
        
        /* Column specific styles */
        .col-symbol { width: 8%; color: #fff; font-weight: 700; }
        .col-price { width: 12%; text-align: right; color: #fff; font-weight: 700; }
        .col-change { width: 10%; text-align: right; font-weight: 700; }
        .col-pe { width: 10%; text-align: right; color: #888; }
        .col-sector { width: 25%; color: #888; overflow: hidden; text-overflow: ellipsis; }
        .col-rating { width: 15%; text-align: center; }
        
        .change.up { color: #00ff41; }
        .change.down { color: #ff6600; }
        .change.neutral { color: #888; }
        .no-data { color: #444; font-style: italic; }
        
        /* Rating badges */
        .rating {
            display: inline-block;
            padding: 1px 4px;
            font-size: 9px;
            border-radius: 2px;
            font-weight: 700;
        }
        .rating-strong-buy { background: #00ff41; color: #000; }
        .rating-buy { background: #90ee90; color: #000; }
        .rating-neutral { background: #666; color: #fff; }
        .rating-sell { background: #ff6600; color: #000; }
        .rating-strong-sell { background: #ff0000; color: #fff; }
        .rating-none { background: #222; color: #666; }
        
        .news-panel { background: #050505; overflow: hidden; display: flex; flex-direction: column; }
        .news-list { overflow-y: auto; flex: 1; }
        .news-item {
            padding: 8px 10px;
            border-bottom: 1px solid #1a1a1a;
            font-size: 11px;
            line-height: 1.3;
        }
        .news-item:hover { background: #1a0f00; }
        .news-time { 
            color: #ff6600; 
            font-size: 9px; 
            margin-bottom: 3px;
            display: flex;
            justify-content: space-between;
        }
        .news-title { color: #ccc; text-decoration: none; display: block; font-size: 11px; }
        .news-title:hover { color: #fff; text-decoration: underline; }
        .news-cat { 
            color: #666; 
            font-size: 9px; 
            background: #1a1a1a;
            padding: 1px 4px;
            display: inline-block;
        }
        
        .loading { 
            color: #ff6600; 
            padding: 15px; 
            text-align: center; 
            font-size: 11px; 
            animation: pulse 1.5s infinite; 
        }
        .error { 
            color: #ff0000; 
            padding: 10px; 
            font-size: 10px; 
            border-left: 3px solid #ff0000; 
            margin: 8px; 
            background: #1a0000; 
        }
        .refresh-btn {
            background: #ff6600;
            color: #000;
            border: none;
            padding: 3px 8px;
            font-family: inherit;
            font-size: 10px;
            cursor: pointer;
            font-weight: 700;
        }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; }
        ::-webkit-scrollbar-thumb:hover { background: #ff6600; }
        
        @media (max-width: 1000px) {
            .container { grid-template-columns: 1fr; grid-template-rows: 1fr 250px; }
            .col-sector { max-width: 80px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">▶ RISK NETWORK GROUP</div>
        
        <div class="social-bar">
            <a href="https://risk.ma" target="_blank" class="social-link website-link">🌐 RISK.MA</a>
            <a href="https://x.com/dogofallstreets" target="_blank" class="social-link">𝕏 X</a>
            <a href="https://tiktok.com/u/@dogofallstreets" target="_blank" class="social-link">🎵 TK</a>
            <a href="https://instagram.com/risk.maroc" target="_blank" class="social-link">📷 IG</a>
            <a href="https://t.me/boursedecasa" target="_blank" class="social-link">✈️ TG</a>
        </div>

        <div class="status">
            <div class="status-item">
                <span class="dot" id="apiDot"></span>
                <span id="apiStatus">CONNECTING...</span>
            </div>
            <div class="status-item" id="clock">00:00:00</span></div>
        </div>
    </div>

    <div class="container">
        <!-- Stocks Panel -->
        <div class="stocks-panel">
            <div class="panel-header" id="stockHeader">◈ MASI ALL SHARES • CHARGEMENT...</div>
            <div style="overflow-y: auto; flex: 1;">
                <table class="stock-table">
                    <thead>
                        <tr>
                            <th class="col-symbol">SYMB</th>
                            <th class="col-price">PRIX</th>
                            <th class="col-change">VAR %</th>
                            <th class="col-pe">P/E</th>
                            <th class="col-sector">SECTEUR</th>
                            <th class="col-rating">RATING</th>
                        </tr>
                    </thead>
                    <tbody id="stockTableBody">
                        <tr><td colspan="6" class="loading">CONNEXION À L'API...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- News Panel -->
        <div class="news-panel">
            <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center;">
                <span>◢ MEDIAS24 • LE BOURSIER</span>
                <button class="refresh-btn" onclick="fetchAllData()">↻ RAFRAICHIR</button>
            </div>
            <div class="news-list" id="newsContainer">
                <div class="loading">CHARGEMENT...</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://risk-network-terminal.onrender.com';
        
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('fr-FR', {hour12: false});
        }
        setInterval(updateClock, 1000);
        updateClock();

        function getRatingClass(rating) {
            if (!rating || rating === '—') return 'rating-none';
            const r = rating.toLowerCase();
            if (r.includes('strong buy')) return 'rating-strong-buy';
            if (r.includes('buy')) return 'rating-buy';
            if (r.includes('sell') && r.includes('strong')) return 'rating-strong-sell';
            if (r.includes('sell')) return 'rating-sell';
            return 'rating-neutral';
        }

        async function fetchStocks() {
            const dot = document.getElementById('apiDot');
            const status = document.getElementById('apiStatus');
            const header = document.getElementById('stockHeader');
            
            dot.className = 'dot sync';
            status.textContent = 'SYNC...';
            
            try {
                const response = await fetch(`${API_BASE}/api/stocks`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const stocks = await response.json();
                renderStocks(stocks);
                
                dot.className = 'dot live';
                status.textContent = 'LIVE';
                
                const liveCount = stocks.filter(s => s.price > 0).length;
                header.textContent = `◈ MASI ALL SHARES • ${liveCount}/${stocks.length} ACTIFS`;
                
            } catch (error) {
                console.error('Error:', error);
                dot.className = 'dot offline';
                status.textContent = 'OFFLINE';
                document.getElementById('stockTableBody').innerHTML = 
                    `<tr><td colspan="6" class="error">ERREUR: ${error.message}</td></tr>`;
            }
        }

        function renderStocks(stocks) {
            const tbody = document.getElementById('stockTableBody');
            if (!stocks || stocks.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="padding: 20px; text-align: center;">AUCUNE DONNÉE</td></tr>';
                return;
            }

            let html = '';
            
            // Sort: active first
            const sorted = stocks.sort((a, b) => {
                if (a.price === 0 && b.price > 0) return 1;
                if (a.price > 0 && b.price === 0) return -1;
                return a.symbol.localeCompare(b.symbol);
            });
            
            sorted.forEach(stock => {
                const hasData = stock.price > 0;
                const changeClass = stock.change > 0 ? 'up' : stock.change < 0 ? 'down' : 'neutral';
                const sign = stock.change > 0 ? '+' : '';
                const peDisplay = stock.pe ? stock.pe.toFixed(1) : '—';
                const ratingClass = getRatingClass(stock.rating);
                const ratingText = stock.rating || '—';
                
                if (hasData) {
                    html += `
                        <tr class="stock-row">
                            <td class="col-symbol">${stock.symbol}</td>
                            <td class="col-price">${stock.price.toFixed(2)}</td>
                            <td class="col-change ${changeClass}">${sign}${stock.change.toFixed(2)}%</td>
                            <td class="col-pe">${peDisplay}</td>
                            <td class="col-sector" title="${stock.sector}">${stock.sector}</td>
                            <td class="col-rating"><span class="rating ${ratingClass}">${ratingText}</span></td>
                        </tr>
                    `;
                } else {
                    html += `
                        <tr class="stock-row" style="opacity: 0.4;">
                            <td class="col-symbol" style="color: #444;">${stock.symbol}</td>
                            <td class="col-price no-data">0.00</td>
                            <td class="col-change neutral no-data">0.00%</td>
                            <td class="col-pe no-data">—</td>
                            <td class="col-sector no-data">${stock.sector}</td>
                            <td class="col-rating"><span class="rating rating-none">—</span></td>
                        </tr>
                    `;
                }
            });
            tbody.innerHTML = html;
        }

        async function fetchNews() {
            const container = document.getElementById('newsContainer');
            container.innerHTML = '<div class="loading">CHARGEMENT RSS...</div>';
            
            const RSS_URL = 'https://medias24.com/categorie/leboursier/actus/feed/';
            const proxies = [
                'https://api.allorigins.win/raw?url=',
                'https://api.codetabs.com/v1/proxy?quest='
            ];
            
            for (let proxy of proxies) {
                try {
                    const response = await fetch(proxy + encodeURIComponent(RSS_URL));
                    if (!response.ok) continue;
                    
                    const xmlText = await response.text();
                    parseRSS(xmlText);
                    return;
                } catch (e) { continue; }
            }
            
            container.innerHTML = '<div class="error">ERREUR CHARGEMENT RSS</div>';
        }

        function parseRSS(xmlText) {
            const parser = new DOMParser();
            const xml = parser.parseFromString(xmlText, 'text/xml');
            const items = xml.querySelectorAll('item');
            
            let html = '';
            const now = new Date();
            
            items.forEach((item, i) => {
                if (i >= 15) return;
                const title = item.querySelector('title')?.textContent || 'Sans titre';
                const link = item.querySelector('link')?.textContent || '#';
                const pubDate = item.querySelector('pubDate')?.textContent || '';
                const category = item.querySelector('category')?.textContent || 'INFO';
                
                let timeText = 'À l\'instant';
                if (pubDate) {
                    const date = new Date(pubDate);
                    const diff = Math.floor((now - date) / 60000);
                    if (diff < 60) timeText = `il y a ${diff}min`;
                    else if (diff < 1440) timeText = `il y a ${Math.floor(diff/60)}h`;
                    else timeText = `il y a ${Math.floor(diff/1440)}j`;
                }
                
                html += `
                    <div class="news-item">
                        <div class="news-time"><span>${timeText}</span><span class="news-cat">${category.toUpperCase()}</span></div>
                        <a href="${link}" target="_blank" class="news-title">${title}</a>
                    </div>
                `;
            });
            
            document.getElementById('newsContainer').innerHTML = html;
        }

        async function fetchAllData() {
            await Promise.all([fetchStocks(), fetchNews()]);
        }

        fetchAllData();
        setInterval(fetchAllData, 30000);
    </script>
</body>
</html>
