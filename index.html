<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>RISK NETWORK | TERMINAL</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'JetBrains Mono', monospace; background: #000; color: #e0e0e0; font-size: 11px; height: 100vh; overflow: hidden; }
        
        .header { background: #000; border-bottom: 2px solid #ff6600; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: #ff6600; font-weight: 800; font-size: 16px; }
        
        .container { display: grid; grid-template-columns: 1fr 320px; height: calc(100vh - 45px); }
        
        /* TABLE ALIGNMENT FIX */
        .stock-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .stock-table th { background: #111; color: #888; font-size: 10px; padding: 10px 5px; text-align: left; border-bottom: 1px solid #333; }
        .stock-table td { padding: 8px 5px; border-bottom: 1px solid #1a1a1a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* Define column widths strictly */
        .col-sym { width: 10%; font-weight: bold; color: #fff; }
        .col-sec { width: 20%; color: #aaa; }
        .col-cap { width: 15%; text-align: right; color: #888; }
        .col-prc { width: 15%; text-align: right; font-weight: bold; }
        .col-var { width: 12%; text-align: right; }
        .col-pe  { width: 8%;  text-align: right; }
        .col-rat { width: 20%; text-align: center; }

        .up { color: #00ff41; }
        .down { color: #ff4444; }
        .rating { padding: 2px 6px; border-radius: 2px; font-size: 9px; font-weight: bold; text-transform: uppercase; }
        .buy { background: #00ff41; color: #000; }
        .sell { background: #ff6600; color: #000; }
        .neutral { background: #333; color: #fff; }

        .panel-header { background: #0a0a0a; padding: 8px; color: #ff6600; font-size: 10px; border-bottom: 1px solid #333; }
        .scroll { overflow-y: auto; height: 100%; }
        
        .news-item { padding: 10px; border-bottom: 1px solid #1a1a1a; }
        .news-title { font-size: 11px; color: #ccc; text-decoration: none; }
        .news-title:hover { color: #ff6600; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">▶ RISK NETWORK GROUP TERMINAL</div>
        <div id="clock">00:00:00</div>
    </div>

    <div class="container">
        <div class="stocks-panel">
            <div class="panel-header">◈ MASI ALL SHARES • LIVE DATA</div>
            <div class="scroll">
                <table class="stock-table">
                    <thead>
                        <tr>
                            <th class="col-sym">TICKER</th>
                            <th class="col-sec">SECTEUR</th>
                            <th class="col-cap">CAPITAL</th>
                            <th class="col-prc">COURS</th>
                            <th class="col-var">VAR%</th>
                            <th class="col-pe">P/E</th>
                            <th class="col-rat">SENTIMENT</th>
                        </tr>
                    </thead>
                    <tbody id="stockBody"></tbody>
                </table>
            </div>
        </div>

        <div class="news-panel">
            <div class="panel-header">◢ MEDIAS24 FLUX</div>
            <div class="scroll" id="newsBody"></div>
        </div>
    </div>

    <script>
        const API = 'https://risk-network-terminal.onrender.com/api';

        async function updateData() {
            try {
                const sResp = await fetch(`${API}/stocks`);
                const stocks = await sResp.json();
                renderStocks(stocks);

                const nResp = await fetch(`${API}/news`);
                const news = await nResp.json();
                renderNews(news);
            } catch (e) { console.error("Update Error", e); }
        }

        function renderStocks(stocks) {
            const html = stocks.map(s => {
                const cClass = s.change > 0 ? 'up' : s.change < 0 ? 'down' : '';
                const rClass = s.rating.toLowerCase().includes('buy') ? 'buy' : 
                               s.rating.toLowerCase().includes('sell') ? 'sell' : 'neutral';
                
                return `
                <tr style="${s.has_live_data ? '' : 'opacity:0.4'}">
                    <td class="col-sym">${s.symbol}</td>
                    <td class="col-sec">${s.sector}</td>
                    <td class="col-cap">${s.capital}</td>
                    <td class="col-prc">${s.price.toFixed(2)}</td>
                    <td class="col-var ${cClass}">${s.change > 0 ? '+' : ''}${s.change.toFixed(2)}%</td>
                    <td class="col-pe">${s.pe ? s.pe.toFixed(1) : '—'}</td>
                    <td class="col-rat"><span class="rating ${rClass}">${s.rating}</span></td>
                </tr>`;
            }).join('');
            document.getElementById('stockBody').innerHTML = html;
        }

        function renderNews(news) {
            document.getElementById('newsBody').innerHTML = news.map(n => `
                <div class="news-item">
                    <a href="${n.link}" target="_blank" class="news-title">${n.title}</a>
                </div>
            `).join('');
        }

        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        }, 1000);

        updateData();
        setInterval(updateData, 60000);
    </script>
</body>
</html>
