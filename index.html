<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>RISK NETWORK GROUP | TERMINAL LIVE</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'JetBrains Mono', monospace; 
            background-color: #000000; 
            color: #e0e0e0; 
            overflow: hidden;
            height: 100vh;
        }
        
        /* Header & Brand Styling from Original */
        .top-bar {
            background: #0a0a0a;
            border-bottom: 2px solid #ff6600;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand { color: #ff6600; font-weight: 800; font-size: 16px; }
        .live-indicator { color: #00ff41; font-size: 12px; }

        /* FIXED COLUMN ALIGNMENT SYSTEM */
        .table-header {
            background: #111;
            display: flex;
            padding: 12px 15px;
            border-bottom: 1px solid #333;
            font-size: 11px;
            color: #888;
            font-weight: bold;
        }
        .table-row {
            display: flex;
            padding: 10px 15px;
            border-bottom: 1px solid #111;
            font-size: 12px;
            align-items: center;
            transition: background 0.2s;
        }
        .table-row:hover { background: #0a0a0a; }

        /* Define exact widths for alignment */
        .col-1 { width: 10%; } /* Ticker */
        .col-2 { width: 25%; } /* Name */
        .col-3 { width: 15%; } /* Sector */
        .col-4 { width: 12%; text-align: right; } /* Capital */
        .col-5 { width: 12%; text-align: right; font-weight: bold; } /* Price */
        .col-6 { width: 10%; text-align: right; } /* Var% */
        .col-7 { width: 16%; text-align: center; } /* Rating */

        .up { color: #00ff41; }
        .down { color: #ff4444; }
        .rating-box {
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: bold;
            background: #222;
        }
        .rating-buy { background: #004d20; color: #00ff41; border: 1px solid #00ff41; }
        .rating-sell { background: #4d1a00; color: #ff6600; border: 1px solid #ff6600; }

        #main-container { height: calc(100vh - 100px); overflow-y: auto; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #ff6600; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="brand">▶ RISK NETWORK GROUP | MOROCCO TERMINAL</div>
        <div class="live-indicator">● LIVE SYNC <span id="clock">00:00:00</span></div>
    </div>

    <div class="table-header">
        <div class="col-1">TICKER</div>
        <div class="col-2">NOM</div>
        <div class="col-3">SECTEUR</div>
        <div class="col-4">CAPITAL</div>
        <div class="col-5">COURS</div>
        <div class="col-6">VAR%</div>
        <div class="col-7">SENTIMENT</div>
    </div>

    <div id="main-container">
        </div>

    <script>
        const API_URL = 'https://risk-network-terminal.onrender.com/api/stocks';

        async function updateTerminal() {
            try {
                const response = await fetch(API_URL);
                const stocks = await response.json();
                const container = document.getElementById('main-container');
                
                container.innerHTML = stocks.map(s => {
                    const isUp = s.change.includes('+');
                    const colorClass = isUp ? 'up' : s.change.includes('-') ? 'down' : '';
                    const rClass = s.rating.toLowerCase().includes('buy') ? 'rating-buy' : 
                                  s.rating.toLowerCase().includes('sell') ? 'rating-sell' : '';
                    
                    return `
                        <div class="table-row" style="${s.active ? '' : 'opacity: 0.4'}">
                            <div class="col-1" style="color:#ff6600; font-weight:800">${s.ticker}</div>
                            <div class="col-2">${s.name}</div>
                            <div class="col-3" style="color:#888; font-size:10px">${s.sector}</div>
                            <div class="col-4">${s.cap}</div>
                            <div class="col-5">${s.price}</div>
                            <div class="col-6 ${colorClass}">${s.change}</div>
                            <div class="col-7">
                                <span class="rating-box ${rClass}">${s.rating}</span>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (e) { console.error("Sync Error", e); }
        }

        // Clock Update
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        }, 1000);

        // Initial Load and Auto-refresh every 60 seconds
        updateTerminal();
        setInterval(updateTerminal, 60000);
    </script>
</body>
</html>
