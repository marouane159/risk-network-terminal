<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Risk Network Terminal</title>
<style>
body{background:#0f1117;color:#e6e6e6;font-family:Arial;margin:0}
.card{background:#1a1d26;margin:15px;padding:15px;border-radius:6px}
h3{margin-top:0}
.up{color:#00c853}
.down{color:#ff1744}
table{width:100%;border-collapse:collapse}
th,td{padding:6px;border-bottom:1px solid #2a2e39;font-size:13px}
th{cursor:pointer;color:#aaa}
#disclaimer{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);
background:#ff1744;padding:6px 12px;border-radius:20px;
animation:flash 1.5s infinite;font-size:12px}
@keyframes flash{0%{opacity:1}50%{opacity:0.3}100%{opacity:1}}
</style>
</head>
<body>

<div class="card">
<h3>MASI</h3>
<div id="masi"></div>
</div>

<div class="card">
<h3>Top Gainers</h3>
<div id="gainers"></div>
</div>

<div class="card">
<h3>Top Losers</h3>
<div id="losers"></div>
</div>

<div class="card">
<h3>All Stocks</h3>
<table>
<thead>
<tr>
<th onclick="sortTable('symbol')">Symbol</th>
<th onclick="sortTable('sector')">Sector</th>
<th onclick="sortTable('price')">Price</th>
<th onclick="sortTable('change')">Change</th>
<th onclick="sortTable('pe')">P/E</th>
</tr>
</thead>
<tbody id="stocks"></tbody>
</table>
</div>

<div id="disclaimer">
⚠️ Ce contenu n'est pas un conseil financier. À but éducatif uniquement.
</div>

<script>
let stocks=[]
let currentSort={col:null,asc:true}

async function fetchData(){
const res=await fetch('/api/all')
const data=await res.json()

renderMASI(data.masi)
renderTop(data.top_gainers,'gainers')
renderTop(data.top_losers,'losers')

stocks=data.stocks||[]
renderStocks(stocks)
}

function renderMASI(m){
if(!m)return
const sign=m.change_percent>=0?'+':''
document.getElementById('masi').innerHTML=
`${m.symbol} ${m.price.toFixed(2)} 
<span class="${m.change_percent>=0?'up':'down'}">
${sign}${m.change_percent.toFixed(2)}%</span>`
}

function renderTop(list,id){
let html=''
list.forEach(s=>{
html+=`${s.symbol} (${s.change.toFixed(2)}%)<br>`
})
document.getElementById(id).innerHTML=html
}

function renderStocks(data){
let html=''
data.forEach(s=>{
html+=`<tr>
<td>${s.symbol}</td>
<td>${s.sector}</td>
<td>${s.price.toFixed(2)}</td>
<td class="${s.change>=0?'up':'down'}">${s.change.toFixed(2)}%</td>
<td>${s.pe?s.pe.toFixed(2):'—'}</td>
</tr>`
})
document.getElementById('stocks').innerHTML=html
}

function sortTable(col){
if(currentSort.col===col){currentSort.asc=!currentSort.asc}
else{currentSort.col=col;currentSort.asc=true}

stocks.sort((a,b)=>{
let A=a[col]||0
let B=b[col]||0
if(A<B)return currentSort.asc?-1:1
if(A>B)return currentSort.asc?1:-1
return 0
})
renderStocks(stocks)
}

fetchData()
setInterval(fetchData,600000)
</script>

</body>
</html>
