<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Network Terminal - Casablanca Stock Exchange</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #111827;
            --bg-tertiary: #1f2937;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-orange: #f59e0b;
            --border-color: #374151;
            --font-mono: 'JetBrains Mono', monospace;
            --font-sans: 'Inter', sans-serif;
        }

        [data-theme="light"] {
            --bg-primary: #ffffff;
            --bg-secondary: #f3f4f6;
            --bg-tertiary: #e5e7eb;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border-color: #d1d5db;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
            border-bottom: 2px solid var(--accent-blue);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .header-content {
            max-width: 1920px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-family: var(--font-mono);
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(45deg, var(--accent-blue), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .market-info {
            display: flex;
            gap: 2rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .masi-ticker {
            background: var(--bg-tertiary);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-family: var(--font-mono);
        }

        .masi-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .masi-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-green);
        }

        .masi-change {
            font-size: 0.875rem;
            color: var(--accent-green);
        }

        .masi-change.negative {
            color: var(--accent-red);
        }

        .market-hours {
            text-align: center;
            padding: 0.5rem 1rem;
            background: var(--bg-tertiary);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .market-status {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            font-size: 0.875rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
            animation: pulse 2s infinite;
        }

        .status-dot.closed {
            background: var(--accent-red);
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .lang-selector, .theme-toggle {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-family: var(--font-sans);
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .lang-selector:hover, .theme-toggle:hover {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
        }

        /* Main Layout */
        .container {
            max-width: 1920px;
            margin: 0 auto;
            padding: 2rem;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 2rem;
        }

        @media (max-width: 1200px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        /* Section Headers */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--accent-blue);
        }

        .section-title {
            font-family: var(--font-mono);
            font-size: 1.25rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-blue);
        }

        .last-update {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-family: var(--font-mono);
        }

        /* Table Styles */
        .table-container {
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }

        thead {
            background: var(--bg-tertiary);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            padding: 1rem;
            text-align: left;
            font-family: var(--font-mono);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
        }

        th:hover {
            color: var(--accent-blue);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            font-family: var(--font-mono);
        }

        tr {
            transition: background 0.2s;
        }

        tr:hover {
            background: rgba(59, 130, 246, 0.1);
        }

        .symbol-cell {
            font-weight: 700;
            color: var(--accent-blue);
        }

        .positive {
            color: var(--accent-green);
        }

        .negative {
            color: var(--accent-red);
        }

        .sector-tag {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: var(--bg-tertiary);
            border-radius: 4px;
            font-size: 0.75rem;
            border: 1px solid var(--border-color);
        }

        .rating {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.75rem;
        }

        .rating-buy {
            background: rgba(16, 185, 129, 0.2);
            color: var(--accent-green);
        }

        .rating-hold {
            background: rgba(245, 158, 11, 0.2);
            color: var(--accent-orange);
        }

        .rating-sell {
            background: rgba(239, 68, 68, 0.2);
            color: var(--accent-red);
        }

        /* News Section */
        .news-container {
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .news-item {
            padding: 1rem 0;
            border-bottom: 1px solid var(--border-color);
            transition: transform 0.2s;
        }

        .news-item:last-child {
            border-bottom: none;
        }

        .news-item:hover {
            transform: translateX(5px);
        }

        .news-title {
            font-weight: 600;
            color: var(--text-primary);
            text-decoration: none;
            display: block;
            margin-bottom: 0.5rem;
            line-height: 1.4;
            transition: color 0.2s;
        }

        .news-title:hover {
            color: var(--accent-blue);
        }

        .news-meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-family: var(--font-mono);
        }

        /* Loading & Error States */
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
            font-family: var(--font-mono);
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-blue);
        }

        /* RTL Support for Arabic */
        [dir="rtl"] {
            direction: rtl;
        }

        [dir="rtl"] th,
        [dir="rtl"] td {
            text-align: right;
        }

        [dir="rtl"] .news-item:hover {
            transform: translateX(-5px);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                text-align: center;
            }
            
            .market-info {
                justify-content: center;
            }
            
            .container {
                padding: 1rem;
            }
            
            table {
                font-size: 0.75rem;
            }
            
            th, td {
                padding: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">RISK NETWORK TERMINAL</div>
            
            <div class="market-info">
                <div class="masi-ticker">
                    <div class="masi-label">MASI Index</div>
                    <div class="masi-value" id="masi-price">--</div>
                    <div class="masi-change" id="masi-change">--</div>
                </div>
                
                <div class="market-hours">
                    <div class="market-status" id="market-status">
                        <span class="status-dot" id="status-dot"></span>
                        <span id="status-text">Checking...</span>
                    </div>
                    <div style="font-size: 0.75rem; color: var(--text-secondary); margin-top: 0.25rem;">
                        <span data-i18n="marketHours">09:30 - 15:40 GMT+1</span>
                    </div>
                </div>
            </div>
            
            <div class="controls">
                <select class="lang-selector" id="lang-selector" onchange="changeLanguage(this.value)">
                    <option value="en">English</option>
                    <option value="fr">Français</option>
                    <option value="ar">العربية</option>
                </select>
                <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">🌙</button>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="main-content">
            <div class="section-header">
                <h2 class="section-title" data-i18n="marketMovers">Market Movers</h2>
                <span class="last-update" id="last-update">--</span>
            </div>
            
            <div class="table-container">
                <table id="stocks-table">
                    <thead>
                        <tr>
                            <th onclick="sortTable(0)">Symbol ↕</th>
                            <th onclick="sortTable(1)">Market Cap ↕</th>
                            <th onclick="sortTable(2)">Sector ↕</th>
                            <th onclick="sortTable(3)">Price ↕</th>
                            <th onclick="sortTable(4)">Change % ↕</th>
                            <th onclick="sortTable(5)">P/E ↕</th>
                            <th onclick="sortTable(6)">Rating ↕</th>
                        </tr>
                    </thead>
                    <tbody id="stocks-body">
                        <tr>
                            <td colspan="7" class="loading">
                                <div class="spinner"></div>
                                <div>Loading market data...</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <aside class="sidebar">
            <div class="section-header">
                <h2 class="section-title" data-i18n="latestNews">Latest News</h2>
            </div>
            
            <div class="news-container" id="news-container">
                <div class="loading">
                    <div class="spinner"></div>
                    <div>Loading news...</div>
                </div>
            </div>
        </aside>
    </main>

    <script>
        // Translations
        const translations = {
            en: {
                marketMovers: "Market Movers",
                latestNews: "Latest News",
                marketHours: "09:30 - 15:40 GMT+1",
                open: "OPEN",
                closed: "CLOSED",
                loading: "Loading...",
                noData: "No data available"
            },
            fr: {
                marketMovers: "Mouvements du Marché",
                latestNews: "Dernières Nouvelles",
                marketHours: "09h30 - 15h40 GMT+1",
                open: "OUVERT",
                closed: "FERMÉ",
                loading: "Chargement...",
                noData: "Aucune donnée disponible"
            },
            ar: {
                marketMovers: "محركات السوق",
                latestNews: "آخر الأخبار",
                marketHours: "09:30 - 15:40 غرينتش+1",
                open: "مفتوح",
                closed: "مغلق",
                loading: "جاري التحميل...",
                noData: "لا توجد بيانات متاحة"
            }
        };

        let currentLang = 'en';
        let currentTheme = 'dark';
        let stocksData = [];
        let sortDirection = {};

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            setInterval(loadData, 600000); // Refresh every 10 minutes
            
            // Check system theme preference
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
                toggleTheme();
            }
        });

        async function loadData() {
            try {
                // Fetch all data in parallel
                const [masiRes, stocksRes, newsRes, statusRes] = await Promise.all([
                    fetch('/api/masi'),
                    fetch('/api/stocks'),
                    fetch('/api/news'),
                    fetch('/api/market-status')
                ]);

                const masi = await masiRes.json();
                const stocks = await stocksRes.json();
                const news = await newsRes.json();
                const status = await statusRes.json();

                updateMasi(masi);
                updateStocks(stocks);
                updateNews(news);
                updateMarketStatus(status);
                
                document.getElementById('last-update').textContent = new Date().toLocaleString();
            } catch (error) {
                console.error('Error loading data:', error);
                showError();
            }
        }

        function updateMasi(data) {
            const priceEl = document.getElementById('masi-price');
            const changeEl = document.getElementById('masi-change');
            
            priceEl.textContent = data.price || '--';
            
            const change = data.change_percent || data.change || '--';
            changeEl.textContent = change;
            changeEl.className = 'masi-change ' + (change.includes('-') ? 'negative' : 'positive');
        }

        function updateStocks(stocks) {
            stocksData = stocks;
            const tbody = document.getElementById('stocks-body');
            
            if (!stocks || stocks.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="loading">${translations[currentLang].noData}</td></tr>`;
                return;
            }

            tbody.innerHTML = stocks.map(stock => {
                const changeClass = (stock.change_percent || '').includes('-') ? 'negative' : 'positive';
                const ratingClass = getRatingClass(stock.rating);
                
                return `
                    <tr>
                        <td class="symbol-cell">${escapeHtml(stock.symbol)}</td>
                        <td>${escapeHtml(stock.market_cap || '—')}</td>
                        <td><span class="sector-tag">${escapeHtml(stock.sector || '—')}</span></td>
                        <td>${escapeHtml(stock.price)}</td>
                        <td class="${changeClass}">${escapeHtml(stock.change_percent)}</td>
                        <td>${escapeHtml(stock.pe || '—')}</td>
                        <td><span class="rating ${ratingClass}">${escapeHtml(stock.rating || '—')}</span></td>
                    </tr>
                `;
            }).join('');
        }

        function getRatingClass(rating) {
            if (!rating) return '';
            const r = rating.toLowerCase();
            if (r.includes('buy') || r.includes('strong')) return 'rating-buy';
            if (r.includes('hold') || r.includes('neutral')) return 'rating-hold';
            if (r.includes('sell')) return 'rating-sell';
            return '';
        }

        function updateNews(newsItems) {
            const container = document.getElementById('news-container');
            
            if (!newsItems || newsItems.length === 0) {
                container.innerHTML = `<div class="loading">${translations[currentLang].noData}</div>`;
                return;
            }

            container.innerHTML = newsItems.map(item => `
                <article class="news-item">
                    <a href="${escapeHtml(item.link)}" target="_blank" class="news-title" dir="auto">
                        ${escapeHtml(item.title)}
                    </a>
                    <div class="news-meta">
                        ${formatDate(item.date)} | Medias24
                    </div>
                </article>
            `).join('');
        }

        function updateMarketStatus(status) {
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');
            
            const isOpen = status.status === 'open';
            dot.className = 'status-dot ' + (isOpen ? '' : 'closed');
            text.textContent = isOpen ? translations[currentLang].open : translations[currentLang].closed;
            text.style.color = isOpen ? 'var(--accent-green)' : 'var(--accent-red)';
        }

        function sortTable(columnIndex) {
            const keys = ['symbol', 'market_cap', 'sector', 'price', 'change_percent', 'pe', 'rating'];
            const key = keys[columnIndex];
            
            sortDirection[key] = !sortDirection[key];
            const direction = sortDirection[key] ? 1 : -1;

            stocksData.sort((a, b) => {
                let aVal = a[key] || '';
                let bVal = b[key] || '';
                
                // Try to parse as numbers
                const aNum = parseFloat(aVal.toString().replace(/[^0-9.-]/g, ''));
                const bNum = parseFloat(bVal.toString().replace(/[^0-9.-]/g, ''));
                
                if (!isNaN(aNum) && !isNaN(bNum)) {
                    return (aNum - bNum) * direction;
                }
                
                return aVal.toString().localeCompare(bVal.toString()) * direction;
            });

            updateStocks(stocksData);
        }

        function changeLanguage(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            
            // Update all translatable elements
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });
            
            // Reload to update content
            loadData();
        }

        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', currentTheme);
            document.getElementById('theme-btn').textContent = currentTheme === 'dark' ? '☀️' : '🌙';
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            try {
                const date = new Date(dateStr);
                return date.toLocaleDateString(currentLang === 'ar' ? 'ar-MA' : currentLang === 'fr' ? 'fr-FR' : 'en-US');
            } catch (e) {
                return dateStr;
            }
        }

        function showError() {
            document.getElementById('stocks-body').innerHTML = 
                `<tr><td colspan="7" class="loading" style="color: var(--accent-red);">Error loading data. Retrying in 10 minutes...</td></tr>`;
        }
    </script>
</body>
</html>
