<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Risk Network Terminal</title>

<style>
:root {
    --bg: #0f1117;
    --card: #1a1d26;
    --border: #2a2e39;
    --text: #e6e6e6;
    --muted: #8c8c8c;
    --up: #00c853;
    --down: #ff1744;
    --neutral: #999;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}

header {
    padding: 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

h1 {
    margin: 0;
    font-size: 20px;
}

.market-status {
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
}

.market-open { background: rgba(0,200,83,0.2); color: var(--up); }
.market-closed { background: rgba(255,23,68,0.2); color: var(--down); }

.container {
    padding: 20px;
}

.card {
    background: var(--card);
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 10px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
}

th {
    color: var(--muted);
    font-weight: normal;
}

.up { color: var(--up); }
.down { color: var(--down); }
.neutral { color: var(--neutral); }

.rating {
    padding: 3px 8px;
    border-radius: 10px;
    font-size: 11px;
}

.rating-strong-buy { background: rgba(0,200,83,0.2); color: var(--up); }
.rating-buy { background: rgba(0,200,83,0.15); color: var(--up); }
.rating-neutral { background: rgba(153,153,153,0.2); color: var(--neutral); }
.rating-sell { background: rgba(255,23,68,0.15); color: var(--down); }
.rating-strong-sell { background: rgba(255,23,68,0.25); color: var(--down); }

.footer {
    text-align: center;
    padding: 15px;
    font-size: 12px;
    color: var(--muted);
}
</style>
</head>

<body>

<header>
    <h1>Risk Network Terminal</h1>
    <div id="marketStatus" class="market-status">Loading...</div>
</header>

<div class="container">

    <div class="card">
        <h2>MASI</h2>
        <div id="masiDisplay" style="display:none;">
            <span id="masiPrice" style="font-size:22px;"></span>
            <span id="masiChange" style="margin-left:10px;"></span>
        </div>
    </div>

    <div class="card">
        <h2 id="stocksTitle">Moroccan Stocks</h2>
        <table>
            <thead>
                <tr>
                    <th>Symbol</th>
                    <th>Sector</th>
                    <th>Market Cap (B MAD)</th>
                    <th>Price</th>
                    <th>Change</th>
                    <th>P/E</th>
                    <th>Rating</th>
                </tr>
            </thead>
            <tbody id="stockTableBody">
                <tr><td colspan="7">Loading...</td></tr>
            </tbody>
        </table>
    </div>

</div>

<div class="footer">
    Auto refresh every 10 minutes
</div>

<script>
let stocksData = [];
let masiData = null;

async function fetchData() {
    try {
        const response = await fetch('/api/all');
        const data = await response.json();

        stocksData = Array.isArray(data.stocks) ? data.stocks : [];
        masiData = data.masi || null;

        updateMarketStatus(data.market_status);
        renderMasi();
        renderStocks();

    } catch (error) {
        document.getElementById('marketStatus').textContent = "HORS LIGNE";
    }
}

function updateMarketStatus(status) {
    const container = document.getElementById('marketStatus');

    if (!status) {
        container.textContent = "HORS LIGNE";
        return;
    }

    if (status.is_open) {
        container.className = "market-status market-open";
        container.textContent = "Market Open";
    } else {
        container.className = "market-status market-closed";
        container.textContent = "Market Closed";
    }
}

function renderMasi() {
    if (!masiData || typeof masiData.price !== 'number') return;

    const display = document.getElementById('masiDisplay');
    const price = document.getElementById('masiPrice');
    const change = document.getElementById('masiChange');

    display.style.display = 'block';

    price.textContent = masiData.price.toFixed(2);

    const changeValue = typeof masiData.change_percent === 'number'
        ? masiData.change_percent
        : 0;

    const sign = changeValue >= 0 ? '+' : '';
    change.textContent = sign + changeValue.toFixed(2) + '%';
    change.className = changeValue >= 0 ? 'up' : 'down';
}

function renderStocks() {
    const tbody = document.getElementById('stockTableBody');

    if (!stocksData.length) {
        tbody.innerHTML = `<tr><td colspan="7">No data available</td></tr>`;
        return;
    }

    let html = '';

    stocksData.forEach(stock => {

        const price = typeof stock.price === 'number'
            ? stock.price.toFixed(2)
            : '—';

        const changeValue = typeof stock.change === 'number'
            ? stock.change
            : null;

        const changeDisplay = changeValue !== null
            ? (changeValue >= 0 ? '+' : '') + changeValue.toFixed(2) + '%'
            : '—';

        const changeClass =
            changeValue > 0 ? 'up' :
            changeValue < 0 ? 'down' :
            'neutral';

        const peDisplay = typeof stock.pe === 'number'
            ? stock.pe.toFixed(1)
            : '—';

        const rating = stock.rating || '—';
        const ratingClass =
            rating === "Strong Buy" ? "rating-strong-buy" :
            rating === "Buy" ? "rating-buy" :
            rating === "Sell" ? "rating-sell" :
            rating === "Strong Sell" ? "rating-strong-sell" :
            "rating-neutral";

        html += `
            <tr>
                <td>${stock.symbol || '—'}</td>
                <td>${stock.sector || '—'}</td>
                <td>${stock.capital ?? '—'}</td>
                <td>${price}</td>
                <td class="${changeClass}">${changeDisplay}</td>
                <td>${peDisplay}</td>
                <td><span class="rating ${ratingClass}">${rating}</span></td>
            </tr>
        `;
    });

    tbody.innerHTML = html;
}

fetchData();
setInterval(fetchData, 600000);
</script>

</body>
</html>
